name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: qr
          POSTGRES_PASSWORD: qr
          POSTGRES_DB: qr_test
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U qr" --health-interval 5s --health-retries 10
    env:
      PG_URL: postgres://qr:qr@127.0.0.1:5432/qr_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:tz
      - run: pnpm security
      - run: pnpm size
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e
