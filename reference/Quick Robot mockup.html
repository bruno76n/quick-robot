function printDlg(pre) {
  const fl = filsOrd().filter(f => rollosDe(f.id).length);
  if (!fl.length) { toast('Primero agrega un rollo en Filamentos.'); return; }
  const sinP = !S.productos.length;
  let curP = null, curK = null, curM = null;
  const filHTML = (p, n) => (p.filamentos || []).filter(f => f.fil).map((f, i) => { const x = byId(S.filamentos, f.fil); return `<div class="frow ro"><span class="sw lg" style="--c:${esc(x ? x.hex : '#ccc')}"></span><span>${esc(fName(x))}<small class="blk">disponible ${gfmt(restanteF(f.fil))}</small></span>${unit(`<input name="g${i}" inputmode="decimal" value="${fmtNum(num(f.g) * n)}" aria-label="Gramos usados de ${esc(fName(x))}">`, 'g')}</div>`; }).join('') || '<p class="muted">Esta pieza no tiene filamentos.</p>';
  openDlg('Registrar impresión', `
    <div class="fld"><span>Motivo</span><div class="seg wide"><label class="rad"><input type="radio" name="motivo" value="inventario"${sinP ? ' disabled' : ' checked'}><span>Para existencias</span></label><label class="rad"><input type="radio" name="motivo" value="prueba"${sinP ? ' checked' : ''}><span>Prueba de material</span></label></div><small>Las impresiones de pedidos aparecen solas en Producción al marcar el pedido como listo.</small></div>
    <div id="p-inv"${sinP ? ' hidden' : ''}>${sinP ? '' : fld('Pieza', `<select name="prod">${S.productos.map(p => `<option value="${p.id}">${esc(p.nombre)}</option>`).join('')}</select>`)}
      <div class="grid2 mt">${fld('Cantidad impresa', '<input name="cant" inputmode="numeric" value="1">', 'Si salió bien, se suman a Existencias.')}</div></div>
    <div id="p-test"${sinP ? '' : ' hidden'}>${fld('Prueba realizada', '<input name="texto" placeholder="Ej.: PLA Silk dorado a 215 °C">')}
      <div class="grid2 mt">${fld('Filamento', `<select name="fil">${fl.map(f => `<option value="${f.id}">${esc(fName(f))} · disponible ${gfmt(restanteF(f.id))}</option>`).join('')}</select>`)}${fld('Gramos usados', unit('<input name="gt" inputmode="decimal" placeholder="0">', 'g'))}</div></div>
    <div class="grid2">${S.impresoras.length ? fld('Impresora', `<select name="imp">${S.impresoras.map(i => `<option value="${i.id}">${esc(i.nombre)}</option>`).join('')}</select>`, 'Impresora utilizada') : ''}${fld('Tiempo real', unit('<input name="horas" inputmode="decimal" value="0">', 'h'))}</div>
    <div class="fld"><span>Resultado</span><div class="seg wide"><label class="rad"><input type="radio" name="res" value="bien" checked><span>Salió bien</span></label><label class="rad"><input type="radio" name="res" value="fallo"><span>Falló</span></label></div></div>
    <div class="fld" id="p-gr"${sinP ? ' hidden' : ''}><span>Gramos usados</span><div id="imp-fil"></div><small>Se descuentan del inventario de filamento, empezando por el rollo abierto. Son editables si el consumo fue distinto.</small></div>`, {
    submit: 'Registrar impresión',
    onInput: f => {
      const E = f.elements, test = E.motivo.value === 'prueba';
      $('#p-inv').hidden = test; $('#p-gr').hidden = test; $('#p-test').hidden = !test;
      if (curM !== null && curM !== test) { if (test) E.horas.value = '0'; else curK = null; }   // al cambiar de uno a otro, el tiempo se vuelve a proponer
      curM = test;
      if (test || !E.prod) return;
      const p = byId(S.productos, E.prod.value); if (!p) return;
      const n = Math.max(1, Math.round(num(E.cant.value, 1))), key = p.id + '|' + n;
      if (p.id !== curP) { curP = p.id; if (E.imp && byId(S.impresoras, p.imp)) E.imp.value = p.imp; }
      if (key !== curK) { curK = key; $('#imp-fil').innerHTML = filHTML(p, n); E.horas.value = fmtNum(num(p.horas) * n); }
    },
    onSubmit: fd => {
      const test = fd.get('motivo') === 'prueba', res = fd.get('res'), tipo = res === 'bien' ? 'consumo' : 'fallo', h = num(fd.get('horas')), usados = [], imId = nid('im');
      let falto = 0, prod = '', texto = '', n = 1;
      if (test) {
        const txt = (fd.get('texto') || '').trim(), fid = fd.get('fil'), g = num(fd.get('gt'));
        if (!txt) { toast('Falta describir la prueba.'); return false; }
        if (!(g > 0)) { toast('Falta la cantidad en gramos.'); return false; }
        const got = sacar(fid, g, tipo, (res === 'bien' ? 'Prueba: ' : 'Prueba fallida: ') + txt, imId);
        usados.push({ fil: fid, g }); falto += g - got; texto = txt;
      } else {
        const p = byId(S.productos, fd.get('prod')); if (!p) return false;
        n = Math.max(1, Math.round(num(fd.get('cant'), 1))); prod = p.id;
        const nota = (res === 'bien' ? '' : 'Fallo: ') + (n > 1 ? n + ' × ' : '') + p.nombre + ' (inventario)';
        p.filamentos.filter(f => f.fil).forEach((f, i) => { const g = num(fd.get('g' + i)); if (g > 0) { const got = sacar(f.fil, g, tipo, nota, imId); usados.push({ fil: f.fil, g }); falto += g - got; } });
      }
      const im = byId(S.impresoras, fd.get('imp')); if (im) im.horas += h;
      const nuevoImp = { id: imId, fecha: dd(0), prod, texto, motivo: test ? 'prueba' : 'inventario', cant: n, imp: fd.get('imp') || '', res, horas: h, filamentos: usados };
      S.imps.push(nuevoImp); usarInsumos(nuevoImp);
      /* las piezas que salieron bien entran a Existencias; si la pieza todavía no las llevaba, desde ahora sí */
      let sumo = '';
      if (!test && res === 'bien') {
        const pr = byId(S.productos, prod), nueva = !llevaStock(pr); pr.stock = true;
        addPm(prod, 'impresion', n, 'Impresión para existencias', imId);
        sumo = ` Se ${n === 1 ? 'sumó 1 pieza' : 'sumaron ' + n + ' piezas'} a Existencias.` + (nueva ? ' La pieza ahora lleva existencias.' : '');
      } else if (!test) sumo = ' No suma piezas porque falló.';
      save(); toast(`${test ? 'Prueba registrada' : 'Impresión registrada'}. Se descontaron ${gfmt(usados.reduce((a, x) => a + x.g, 0) - falto)}.` + sumo + (falto > .05 ? ` Inventario insuficiente: faltaron ${gfmt(falto)}.` : '')); render();
    }
  });
  if (pre && dlgForm.elements.prod && byId(S.productos, pre)) { dlgForm.elements.prod.value = pre; if (dlgForm.oninput) dlgForm.oninput(null); }
}

/* ============ Existencias ============

   nunca se escribe "tengo 7". Libres = las que puedes vender hoy · Apartadas = ya son de un pedido aceptado y nadie más las puede vender. */
const exPiezas = () => prodsConStock().sort((a, b) => a.nombre.localeCompare(b.nombre, 'es'));
function exEstado(p) {
  const f = fisicas(p.id), a = Math.min(f, apartadas(p.id)), l = f - a;
  return f <= 0 ? ['Agotada', 'bad'] : l <= 0 ? ['Todo apartado', 'info'] : l <= 2 ? ['Pocas', 'warn'] : ['Disponible', 'good'];
}
function apartadasLista(pid) {
  return S.pedidos.map(x => ({ x, n: x.estado === 'listo' ? ((x.stk || {})[pid] || 0) : (x.estado === 'aceptado' || x.estado === 'produccion') ? pedUsoDe(x, pid) : 0 })).filter(o => o.n > 0);
}
function exDetalle(p) {

  const ms = S.pmovs.filter(m => m.prod === p.id).sort((x, y) => y.fecha.localeCompare(x.fecha) || (y.id > x.id ? 1 : -1)).slice(0, 14);
  const [elab, ecls] = exEstado(p);
  return `<div class="det-h">${miniP(p)}<div><h2>${esc(p.nombre)}</h2><small>Precio de lista ${mx0(pr)} · Costo ${mx(k)}</small></div></div>
    <dl class="dl"><div><dt>Total</dt><dd class="num">${f}<small>${chip(elab, ecls)}</small></dd></div><div><dt>Libres</dt><dd class="num">${l}</dd></div><div><dt>Apartadas</dt><dd class="num">${a}<small>${a ? 'en pedidos aceptados' : 'sin pedidos'}</small></dd></div><div><dt>Valor de lista</dt><dd class="num">${mx0(f * pr)}<small>costo ${mx0(f * k)}</small></dd></div></dl>
    <div class="det-a btnrow"><button type="button" class="btn sm primary" data-act="print-new" data-id="${p.id}">Registrar impresión</button><button type="button" class="btn sm" data-act="ex-ajuste" data-id="${p.id}">Ajustar</button>${l > 0 ? `<button type="button" class="btn sm" data-act="venta-new" data-k="p" data-id="${p.id}">Vender</button>` : `<button type="button" class="btn sm" data-act="ped-new" data-k="p" data-id="${p.id}">Hacer pedido</button>`}</div>
    ${ap.length ? `<h3>Apartadas para pedidos</h3><ul class="apl">${ap.map(o => `<li><button type="button" class="link" data-act="ped-open" data-id="${o.x.id}">Pedido #${o.x.folio} · ${esc(clienteN(o.x.cliente))}</button><span class="num">${o.n} ${o.n === 1 ? 'pieza' : 'piezas'}</span>${chip(ESTADOS[o.x.estado][0], ESTADOS[o.x.estado][1])}</li>`).join('')}</ul><p class="hint">Siguen en Existencias, pero están reservadas. Salen al entregar el pedido.</p>` : ''}
    <h3>Movimientos</h3>
    ${ms.length ? `<p class="hint">Las existencias se calculan sumando cada movimiento; no se editan directamente.</p>
      <div class="tw"><table class="tbl sm"><thead><tr><th>Fecha</th><th>Movimiento</th><th class="r">Piezas</th><th>Nota</th></tr></thead><tbody>${ms.map(m => { const t = PM_TIPOS[m.tipo] || PM_TIPOS.ajuste; return `<tr><td>${fDate(m.fecha)}</td><td>${chip(t[0], t[1])}</td><td class="r num ${m.n >= 0 ? 'pos' : ''}">${m.n > 0 ? '+' : ''}${m.n}</td><td class="nota">${esc(m.nota)}</td></tr>`; }).join('')}</tbody></table></div>`
      : '<p class="muted">Sin movimientos. Registra una impresión para existencias o usa Ajustar para indicar el conteo actual.</p>'}`;
}
function vExistencias() {
  const ps = exPiezas();

/* ajustar: regalos, daños, o contar lo que hay de verdad */
function ajusteDlg(pid) {
  const p = byId(S.productos, pid); if (!p) return;
  const f = fisicas(pid), a = Math.min(f, apartadas(pid)), l = f - a;
  const info = fd => {
    const t = fd.tipo.value, n = Math.max(0, Math.round(num(fd.n.value))), lab = $('#aj-lab');
    lab.textContent = t === 'conteo' ? 'Conteo total' : 'Cantidad de piezas';
    const delta = t === 'conteo' ? n - f : t === 'extra' ? n : -n;
    let msg = '', ok = true;
    if (!n && t !== 'conteo') { msg = 'Falta la cantidad de piezas.'; ok = false; }
    else if (t === 'conteo' && n < a) { msg = `El conteo no puede ser menor a ${a} (apartadas para pedidos).`; ok = false; }
    else if (t === 'conteo' && delta === 0) { msg = 'El conteo coincide con el total actual.'; ok = false; }
    else if (delta < 0 && -delta > l) { msg = `Solo hay ${l} libres; ${a} están apartadas para pedidos.`; ok = false; }
    else msg = `Total: de <b>${f}</b> a <b>${f + delta}</b> piezas.`;
    $('#aj-prev').innerHTML = msg; $('#aj-prev').classList.toggle('warn', !ok);
    return { t, n, delta, ok };
  };
  openDlg(`Ajustar existencias · ${esc(p.nombre)}`, `<p>Total <b>${f}</b> · Libres <b>${l}</b> · Apartadas <b>${a}</b></p>
    <div class="grid2">${fld('Motivo', '<select name="tipo"><option value="regalo">Regalo o muestra</option><option value="dano">Dañada o defectuosa</option><option value="extra">Piezas sin registrar (sumar)</option><option value="conteo">Conteo: total real</option></select>')}
    <label class="fld"><span id="aj-lab">Cantidad de piezas</span><input name="n" inputmode="numeric" value="1"></label></div>
    ${fld('Nota', '<input name="nota" placeholder="Destino o detalle">')}

    submit: 'Registrar',
    onInput: fd => { info(fd.elements); },

      S.pmovs.push({ id: nid('pm'), prod: pid, fecha: dd(0), tipo: 'ajuste', n: r.delta, nota: nom + (nota ? ': ' + nota : ''), ref: '' });
      save(); toast(`Existencias de ${p.nombre}: total ${fisicas(pid)}.`); render();
    }
  });
}

/* ============ Clientes ============
   Cada cliente tiene su ficha completa: contacto, logo, notas y todo lo que lleva con nosotros (pedidos y ventas).
   Se crea y se edita con el mismo formulario desde esta pantalla, desde un pedido y desde una venta. */
const selScroll = () => { try { if (matchMedia('(max-width: 1000px)').matches) { const d = $('.detail'); if (d) d.scrollIntoView({ block: 'start' }); } } catch (e) { } };

  const ps = cliPedidos(c.id).map(p => ({ f: p.creado || p.entrega, t: 'ped', x: p })), vs = cliVentas(c.id).filter(v => !v.pedido).map(v => ({ f: v.fecha, t: 'ven', x: v }));
  const all = [...ps, ...vs].sort((x, y) => y.f.localeCompare(x.f)), mas = Math.max(0, all.length - 12);
  if (!all.length) return '<p class="muted">Todavía no tiene pedidos ni ventas.</p>';
  const estV = v => v.devol ? chip('Devuelta', 'bad') : ventaDebe(v) > 0 ? chip('Debe ' + mx0(ventaDebe(v)), 'warn') : chip('Pagada', 'good');
  const rows = all.slice(0, 12).map(o => o.t === 'ped'
    ? `<tr class="click" data-act="ped-open" data-id="${o.x.id}" tabindex="0"><td>${fDate(o.f)}</td><td><b>Pedido #${o.x.folio}</b><small class="blk">${esc(itemsTxt(pedItems(o.x), 3))}</small></td><td>${chip(ESTADOS[o.x.estado][0], ESTADOS[o.x.estado][1])}</td><td class="r num">${mx0(pedTotal(o.x))}</td></tr>`
    : `<tr class="click" data-act="venta-open" data-id="${o.x.id}" tabindex="0"><td>${fDate(o.f)}</td><td><b>Venta</b><small class="blk">${esc(itemsTxt(ventaItems(o.x), 3))}</small></td><td>${estV(o.x)}</td><td class="r num">${mx0(ventaBruto(o.x))}</td></tr>`).join('');
  return `<div class="tw"><table class="tbl sm hist"><thead><tr><th>Fecha</th><th>Detalle</th><th>Estado</th><th class="r">Total</th></tr></thead><tbody>${rows}</tbody></table></div>${mas ? `<p class="hint">Se muestran los últimos 12 de ${all.length}.</p>` : ''}`;
}
/* la página de un cliente: quién es, cuánto ha comprado y su historial */

function vCliente() {

function logoThumb(file, cb, max = 160, mime = 'image/png', q = .8) {
  const fr = new FileReader();
  fr.onerror = () => cb(null);
  fr.onload = () => {
    const im = new Image();
    im.onerror = () => cb(null);
    im.onload = () => {
      const iw = im.naturalWidth || 160, ih = im.naturalHeight || 160, k = Math.min(1, max / Math.max(iw, ih)), w = Math.max(1, Math.round(iw * k)), h = Math.max(1, Math.round(ih * k));
      const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
      try { cv.getContext('2d').drawImage(im, 0, 0, w, h); cb(cv.toDataURL(mime, q)); } catch (e) { cb(null); }
    };
    im.src = fr.result;
  };

}

/* ============ Reportes ============ */
/* El periodo son los últimos N días contando hoy (o todo el historial). El periodo anterior mide lo mismo, justo antes. */
const REP_PER = [['7', '7 días'], ['30', '30 días'], ['90', '90 días'], ['todo', 'Todo']];
const DIA3 = ['dom', 'lun', 'mar', 'mié', 'jue', 'vie', 'sáb'];
const MES_L = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];
const dObj = n => new Date(dd(n) + 'T12:00:00');
const ventasEntre = (a, b) => S.ventas.filter(v => { const n = daysTo(v.fecha); return n >= a && n <= b; });
const fRango = (a, b) => a === b ? fDate(dd(a)) : fDate(dd(a)) + ' al ' + fDate(dd(b));
function niceScale(m) {
  m = Math.max(m, 1);
  const e0 = Math.floor(Math.log10(m));
  for (let e = e0 - 2; e <= e0 + 1; e++) for (const f of [1, 2, 2.5, 5]) { const st = f * Math.pow(10, e); if (m / st <= 5 + 1e-9) return { step: st, top: Math.ceil(m / st - 1e-9) * st }; }
  return { step: m / 4, top: m };
}

function repRango() {
  const k = REP_PER.some(x => x[0] === UI.rep) ? UI.rep : '30';
  let a;
  if (k === 'todo') { const f = S.ventas.map(v => daysTo(v.fecha)); a = f.length ? Math.min(0, ...f) : -29; }
  else a = -(+k - 1);
  const n = 1 - a;
  return { k, a, b: 0, n, ant: k === 'todo' ? null : { a: a - n, b: a - 1 } };
}
/* totales de un conjunto de ventas, con lo que se dejó de cobrar por descuentos contra el precio de lista */
function repTot(vs) {
  const t = totVentas(vs);
  t.n = vs.length;
  t.lista = vs.reduce((a, v) => a + ventaLista(v), 0);
  t.desc = vs.reduce((a, v) => a + ventaItems(v).reduce((x, it) => x + Math.max(0, itemLista(it) - itemTot(it)), 0), 0);
  return t;
}
/* columnas de la gráfica: días si el periodo es corto, semanas de lunes a domingo si es medio, meses si es largo */
function repBuckets(R) {
  const bks = [], add = (a, b, l, t, parcial) => { const vs = ventasEntre(a, b), x = totVentas(vs); bks.push({ a, b, l, t, parcial: !!parcial, n: vs.length, ingreso: x.ingreso, costo: x.costo, com: x.com, gan: x.gan, piezas: x.piezas }); };
  let unidad = 'día';
  if (R.n <= 10) {
    for (let d = R.a; d <= R.b; d++) { const f = dObj(d); add(d, d, DIA3[f.getDay()] + ' ' + f.getDate(), DIA3[f.getDay()] + ' ' + fDate(dd(d))); }
  } else if (R.n <= 100) {
    unidad = 'semana';
    for (let s = R.a; s <= R.b;) {
      const wd = (dObj(s).getDay() + 6) % 7, fin = s + (6 - wd), e = Math.min(R.b, fin);
      add(s, e, fDate(dd(s)), 'Semana del ' + fRango(s, e), fin > R.b);
      s = e + 1;
    }
  } else {
    unidad = 'mes';
    for (let s = R.a; s <= R.b;) {
      const key = dd(s).slice(0, 7); let e = s;
      while (e < R.b && dd(e + 1).slice(0, 7) === key) e++;
      const f = dObj(s), mes = MES_L[f.getMonth()];
      add(s, e, mes.slice(0, 3), mes[0].toUpperCase() + mes.slice(1) + ' ' + f.getFullYear(), e === R.b && dObj(R.b + 1).getMonth() === f.getMonth());
      s = e + 1;
    }
  }
  return { bks, unidad };
}
/* en qué se va el costo, por concepto. Cada venta guarda su costo total; el reparto usa la proporción actual de cada pieza (estimado). */
function repConceptos(vs) {
  const k = { M: 0, L: 0, Q: 0, E: 0, F: 0 };
  vs.forEach(v => ventaItems(v).forEach(it => lineasItem(it).forEach(l => {
    const p = byId(S.productos, l.prod), c = p ? costo(p) : null;
    if (c && c.total > 0) ['M', 'L', 'Q', 'E', 'F'].forEach(q => { k[q] += l.costo * c[q] / c.total; });
    else k.E += l.costo;
  })));
  return k;
}
function repColecciones(vs) {
  const g = {};
  vs.forEach(v => {
    const cm = comisionCanal(v.canal) / 100;
    ventaItems(v).forEach(it => {
      if (it.k !== 'c') return;
      const c = byId(S.colecciones, it.col), x = g[it.col] || (g[it.col] = { n: c ? c.nombre : it.nombre, cant: 0, ingreso: 0, costo: 0, gan: 0 });
      x.cant += it.cant; x.ingreso += itemTot(it); x.costo += itemCosto(it); x.gan += itemTot(it) * (1 - cm) - itemCosto(it);
    });
  });
  return Object.values(g).sort((a, b) => b.gan - a.gan);
}
function repClientes(vs) {
  const g = {};
  vs.forEach(v => {
    const id = v.cliente || '', x = g[id] || (g[id] = { id, n: id ? clienteN(id) : 'Sin cliente (mostrador)', ventas: 0, ingreso: 0, gan: 0, debe: id ? cliStats(id).porCobrar : 0 });
    x.ventas++; x.ingreso += ventaIngreso(v); x.gan += ventaGan(v);
  });
  return Object.values(g).sort((a, b) => b.ingreso - a.ingreso);
}
/* lo que se usó de filamento y lo que se imprimió en el periodo */
function repTaller(R) {
  const en = f => { const n = daysTo(f); return n >= R.a && n <= R.b; };
  const use = {}, hexs = {}; let usado = 0, perdido = 0;
  S.movs.filter(m => en(m.fecha) && (m.tipo === 'consumo' || m.tipo === 'fallo' || m.tipo === 'merma')).forEach(m => {
    const r = byId(S.rollos, m.rollo); if (!r) return;
    { const fx = byId(S.filamentos, r.fil); hexs[rName(r)] = fx && fx.hex; }
    use[rName(r)] = (use[rName(r)] || 0) - m.g; usado += -m.g; if (m.tipo !== 'consumo') perdido += -m.g;
  });
  const imps = S.imps.filter(x => en(x.fecha)), fallos = imps.filter(x => x.res === 'fallo').length;
  const maq = S.impresoras.map(i => {
    const xs = imps.filter(x => x.imp === i.id);
    return { i, n: xs.length, h: xs.reduce((a, x) => a + num(x.horas), 0), f: xs.filter(x => x.res === 'fallo').length, ch: i.costo / i.vidaH + i.mantoH + i.kw * S.config.kwh };
  });
  return { useL: Object.entries(use).sort((a, b) => b[1] - a[1]).map(([n, g]) => [n, g, hexs[n]]), usado, perdido, nImps: imps.length, fallos, maq };
}
/* lo que hay hoy: piezas terminadas y filamento, a costo y a precio de lista */
function repInventario() {
  let piezas = 0, aCosto = 0, aLista = 0, g = 0, val = 0, rollos = 0;
  prodsConStock().forEach(p => { const f = fisicas(p.id); piezas += f; aCosto += f * costo(p).total; aLista += f * precioDe(p); });
  S.rollos.forEach(r => { const q = Math.max(0, restante(r)); if (q > .05) rollos++; g += q; val += q * costoG(r); });
  return { piezas, aCosto, aLista, g, val, rollos, ...stockTot() };
}
/* ▲ ▼ contra el periodo anterior; buena = subir es bueno (se pinta), si no queda en gris */
function repDelta(cur, prev, buena, fmt) {
  const tip = `data-tip="Periodo anterior: ${esc(fmt(prev))}"`;
  if (!prev) return cur ? `<span class="d" ${tip}>Antes: ${esc(fmt(0))}</span>` : `<span class="d" ${tip}>Sin cambio</span>`;
  const p = (cur - prev) / Math.abs(prev) * 100;
  if (Math.abs(p) < .5) return `<span class="d" ${tip}>= Sin cambio</span>`;
  return `<span class="d ${buena ? (p > 0 ? 'up' : 'dn') : ''}" ${tip}>${p > 0 ? '▲' : '▼'} ${nf1.format(Math.abs(p))}%</span>`;
}
function repCalc() {
  const R = repRango(), vs = ventasEntre(R.a, R.b), T = repTot(vs), A = R.ant ? repTot(ventasEntre(R.ant.a, R.ant.b)) : null;
  const porCanal = S.config.canales.map(c => { const xs = vs.filter(v => v.canal === c.n); return { n: c.n, ventas: xs.length, ...totVentas(xs) }; }).filter(x => x.ventas > 0);
  return { R, vs, T, A, porCanal, rank: rankProductos(vs), ...repBuckets(R), k: repConceptos(vs) };
}
function repResumen() {
  const { R, T, A, porCanal, rank } = repCalc();
  const dl = (c, p) => !A ? '' : !p ? '' : ` (${c >= p ? '+' : '−'}${nf1.format(Math.abs((c - p) / p * 100))}% contra el periodo anterior)`;
  const L = [`Quick Robot · Reporte ${R.k === 'todo' ? 'de todo el historial' : 'de ' + R.n + ' días'} (${fRango(R.a, R.b)})`, '',
    `Total de ventas: ${mx0(T.ingreso)}${dl(T.ingreso, A && A.ingreso)} · ${T.n} ${T.n === 1 ? 'venta' : 'ventas'}, ${T.piezas} piezas`,
    `Costo: ${mx0(T.costo)}`, `Comisiones: ${mx0(T.com)}`,
    `Ganancia: ${mx0(T.gan)}${dl(T.gan, A && A.gan)} · Margen ${pct(T.margen)}`, `Descuentos: ${mx0(T.desc)}`];
  if (S.gastos.length) { const g = gastosEntre(R.a, R.b); L.push(`Gastos del negocio: ${mx0(g)} · Ganancia real: ${mx0(T.gan - g)}`); }
  if (porCanal.length) L.push('', 'Por canal:', ...porCanal.map(c => `· ${c.n}: ${mx0(c.ingreso)} (ganancia ${mx0(c.gan)})`));
  if (rank.length) L.push('', 'Piezas con más ganancia:', ...rank.slice(0, 5).map((r, i) => `${i + 1}. ${r.n}: ${mx0(r.gan)} (${r.cant} vendidas)`));
  const act = S.pedidos.filter(p => ['aceptado', 'produccion', 'listo'].includes(p.estado));

/* ---- resumen en frase + "de cada $100": en vez de cuadros de números, cuenta a dónde se va el dinero ---- */
function cmpPill(lab, cur, prev, buena, fmt = mx0) {
  if (!prev) return '';
  const p = (cur - prev) / Math.abs(prev) * 100, tip = `data-tip="Periodo anterior: ${esc(fmt(prev))}"`;
  if (Math.abs(p) < .5) return `<span class="pill" ${tip}>${lab} sin cambio</span>`;
  return `<span class="pill ${(p > 0) === buena ? 'good' : 'bad'}" ${tip}>${lab} ${p > 0 ? '▲' : '▼'} ${nf1.format(Math.abs(p))}%</span>`;
}
const p100 = x => '$' + (x >= 10 ? Math.round(x) : nf1.format(x));
/* barra repartida: segs = [[nombre, monto, color, clase]]; base = lo que vale el 100% */
function c100Bar(segs, base, label, cls = '', fmt = mx0) {
  const tot = segs.reduce((a, s) => a + s[1], 0), esc2 = Math.max(base, tot, 1);
  const bar = segs.filter(s => s[1] > 0).map(s => {
    const w = s[1] / esc2 * 100, tip = `${s[0]}: ${fmt(s[1])}${base ? ' · ' + p100(s[1] / base * 100) + ' de cada $100' : ''}`;
    return `<i class="${s[3] || ''}" style="width:${w.toFixed(2)}%;--s:var(${s[2]})" data-tip="${esc(tip)}" tabindex="0">${w >= 9 && base ? `<span>${p100(s[1] / base * 100)}</span>` : ''}</i>`;
  }).join('');

/* o: T (totales con .desc), K (costo por concepto), gA (gastos del periodo o null), A y gP (periodo anterior) */
function briefHTML(o) {
  const { T, K, gA = null, A = null, gP = null, cuando = '', extra = [], compacto = false, vacio = 'Sin ventas en este periodo. Cuando haya ventas, aquí se cuenta cuánto se vendió y a dónde se fue cada peso.' } = o;
  if (!T.n) return `<section class="brf one"><p class="brf-l mut">${vacio}</p></section>`;
  const real = T.gan - (gA || 0);
  let fr = `Se vendieron <b>${mx0(T.ingreso)}</b> en ${T.n} ${T.n === 1 ? 'venta' : 'ventas'}${cuando ? ' ' + cuando : ''}. Después de costo y comisiones quedaron <b class="${T.gan < 0 ? 'r' : 'g'}">${mx0(T.gan)}</b> de ganancia`;
  if (gA != null) fr += `, y tras los gastos del negocio <b class="${real < 0 ? 'r' : 'g'}">${mx0(real)}</b>`;
  fr += '.';
  const chips = A && A.n ? [cmpPill('Ventas', T.ingreso, A.ingreso, true), cmpPill('Ganancia', T.gan, A.gan, true), gA != null ? cmpPill('Gastos', gA, gP, false) : ''].join('') : '';
  const hechos = [`Venta promedio <b>${mx0(T.ingreso / T.n)}</b>`, `<b>${nf1.format(T.piezas)}</b> ${T.piezas === 1 ? 'pieza' : 'piezas'} (${nf1.format(T.piezas / T.n)} por venta)`];
  if (T.desc > 0) hechos.push(`Descuentos <b>${mx0(T.desc)}</b>`);
  hechos.push(...extra);
  const segs = [['Material', K.M, '--c-m'], ['Luz', K.L, '--c-l'], ['Máquina', K.Q, '--c-q'], ['Extras', K.E, '--c-e', 'dk'], ['Fallos (reserva)', K.F, '--c-f', 'hatch'], ['Comisiones', T.com, '--blue']];
  if (gA != null) segs.push(['Gastos del negocio', gA, '--sand', 'dk']);
  const resto = Math.max(0, T.ingreso - segs.reduce((a, s) => a + s[1], 0));
  segs.push([gA != null ? 'Ganancia real' : 'Ganancia', resto, '--green', 'gan dk']);
  return `<section class="brf" aria-label="Resumen del periodo">
    <div class="brf-t"><p class="brf-l">${fr}</p>${chips ? `<div class="brf-c">${chips}<small>contra el periodo anterior</small></div>` : ''}${compacto ? '' : `<p class="brf-f">${hechos.map(h => `<span>${h}</span>`).join('')}</p>`}</div>
    <div class="brf-m"><h3 class="brf-h">De cada $100 vendidos, a dónde se va</h3>${c100Bar(segs, T.ingreso, 'De cada $100 vendidos: costo por concepto, comisiones' + (gA != null ? ', gastos' : '') + ' y ganancia')}${real < 0 ? `<p class="note warn mt">Los gastos superan la ganancia de ventas por ${mx0(-real)}.</p>` : ''}${compacto ? '' : '<p class="hint">Costo por concepto estimado con los costos actuales de cada pieza.</p>'}</div>
  </section>`;
}

    ${I.aCosto + I.val > 0 ? c100Bar([['Piezas terminadas', I.aCosto, '--c-l'], ['Filamento', I.val, '--c-q']], 0, 'Inventario a costo: piezas y filamento', 'sm') : ''}<p class="hint">Total en inventario: ${mx0(I.aCosto + I.val)} (piezas a costo + filamento).${cot.length ? ` ${cot.length} ${cot.length === 1 ? 'cotización espera' : 'cotizaciones esperan'} respuesta por ${mx0(cotT)}.` : ''}</p>`;

  return `${head('Reportes', 'Comparado contra el periodo anterior.', `<button class="btn" data-act="rep-copy">${ico('copy', 16)}Copiar resumen</button>`)}

/* ============ Canales de venta y respaldo ============ */
/* renombrar un canal lo cambia en todas las ventas y pedidos que lo usan: nunca queda un canal que ya no existe */
function canalRename(el) {
  const i = +el.dataset.i, c = S.config.canales[i]; if (!c) return;
  const nuevo = el.value.trim(), viejo = c.n;
  if (nuevo === viejo) { el.value = viejo; return; }
  if (!nuevo) { el.value = viejo; toast('Falta el nombre del canal.'); return; }
  if (S.config.canales.some((x, k) => k !== i && norm(x.n) === norm(nuevo))) { el.value = viejo; toast(`Ya existe un canal llamado “${nuevo}”.`); return; }
  c.n = nuevo; let n = 0;
  S.ventas.forEach(v => { if (v.canal === viejo) { v.canal = nuevo; n++; } });
  S.pedidos.forEach(p => { if (p.canal === viejo) { p.canal = nuevo; n++; } });
  if (B && B.canal === viejo) B.canal = nuevo;
  if (UI.canal === viejo) UI.canal = nuevo;
  save(); toast('Canal renombrado.' + (n ? ` Se actualizaron ${n} ${n === 1 ? 'registro' : 'registros'}.` : ''));
}
function canalAdd() {
  let n = 'Nuevo canal', k = 2; while (S.config.canales.some(x => norm(x.n) === norm(n))) n = 'Nuevo canal ' + k++;
  S.config.canales.push({ n, c: 0 }); save(); render();
  const inp = $(`[data-canal=n][data-i="${S.config.canales.length - 1}"]`); if (inp) { inp.focus(); inp.select(); }
}
function canalDel(b) {
  const i = +b.dataset.i, c = S.config.canales[i]; if (!c) return;
  if (S.config.canales.length <= 1) { toast('Debe quedar al menos un canal de venta.'); return; }
  const nv = S.ventas.filter(v => v.canal === c.n).length, np = S.pedidos.filter(p => p.canal === c.n).length;
  if (nv || np) { toast(`“${c.n}” tiene ${nv} ${nv === 1 ? 'venta' : 'ventas'} y ${np} ${np === 1 ? 'pedido' : 'pedidos'}. No se puede quitar; se puede renombrar.`); return; }
  if (!dosToques(b, '¿Quitar?')) return;
  S.config.canales.splice(i, 1);
  if (B && B.canal === c.n) B.canal = S.config.canales[0].n;
  if (UI.canal === c.n) UI.canal = 'todos';
  save(); toast(`Canal “${c.n}” quitado.`); render();
}
function restaurarDlg() {
  openDlg('Restaurar respaldo', `<p>Respaldo generado con “Copiar respaldo”. Reemplaza todos los datos actuales; antes se guarda una copia de seguridad.</p>
    <label class="fld"><span>Respaldo</span><textarea name="txt" rows="7" spellcheck="false" placeholder="Respaldo completo"></textarea></label>
    <p class="note" id="rb-prev">Sin contenido pegado.</p>`, {

/* ============ Gastos del negocio ============
   Lo que cuesta mantener el negocio y no se reparte entre piezas. El filamento, la luz y la máquina ya van en el costo de cada pieza: aquí no se repiten. */
const gastoCuando = g => g.rec ? `Cada mes desde ${fDate(g.fecha)}${g.fin ? ' hasta ' + fDate(g.fin) : ''}` : fDate(g.fecha);
function vGastos() {
  const vs = ventasRango(30), T = totVentas(vs), g30 = gastosEntre(-29, 0), real = T.gan - g30, fij = fijosMes();
  const mg = T.ingreso > 0 ? T.gan / T.ingreso : 0, eq = mg > 0 ? g30 / mg : 0, av = eq > 0 ? Math.min(100, T.ingreso / eq * 100) : 100;
  const cats = gastosPorCat(-29, 0), maxC = Math.max(1, ...cats.map(c => c.v));
  const lista = [...S.gastos].sort((x, y) => y.fecha.localeCompare(x.fecha));
  const nFijos = S.gastos.filter(g => g.rec && (!g.fin || daysTo(g.fin) >= 0)).length;

    ${emptyCard('Anota la renta, el internet, las herramientas o la publicidad y el sistema calcula tu ganancia real y cuánto necesitas vender para no perder. El filamento, la luz y la máquina no se capturan aquí: ya van en el costo de cada pieza.', `<button class="btn primary" data-act="gasto-new">${ico('plus', 16)}Registrar el primer gasto</button>`)}`;
  return `${head('Gastos', 'Lo que no va en el costo de cada pieza.', acciones)}
  ${sumLine(`En los últimos 30 días hubo <b>${mx0(g30)}</b> en gastos. Las ventas dejaron <b>${mx0(T.gan)}</b> de ganancia, así que la ganancia real fue <b class="${real >= 0 ? 'g' : 'r'}">${mx0(real)}</b>. Los gastos fijos suman <b>${mx0(fij)}</b> al mes (${nFijos} ${nFijos === 1 ? 'se repite' : 'se repiten'})${eq ? `; para no perder hay que vender <b>${mx0(eq)}</b> cada 30 días` : ''}.`, real >= 0 && T.gan > 0 ? c100Bar([['Gastos', g30, '--sand', 'dk'], ['Ganancia real', real, '--green', 'gan dk']], 0, 'De la ganancia de ventas: gastos y ganancia real', 'sm') : '')}
  <div class="cols2 soft">
    <section>
      <h2>Por categoría</h2>
      ${cats.length ? `<ul class="rk cat">${cats.map(c => `<li><div class="rk-m"><div class="rk-t"><b>${esc(c.cat)}</b><span class="num">${mx0(c.v)}</span></div><div class="rk-b"><i class="pu" style="width:${Math.max(3, c.v / maxC * 100)}%"></i></div></div></li>`).join('')}</ul>` : '<p class="muted">Sin gastos en este periodo.</p>'}
    </section>
    <section>
      <h2>Punto de equilibrio</h2>
      ${eq ? `<p class="muted">Con gastos de <b>${mx0(g30)}</b> y un margen de <b>${pct(mg * 100)}</b> por venta, hay que vender <b>${mx0(eq)}</b> en 30 días para que la ganancia cubra los gastos.</p>
      <div class="eq"><div class="rk-b big"><i style="width:${av}%"></i></div><div class="eq-t"><span>Vendido <b>${mx0(T.ingreso)}</b></span><span>Meta <b>${mx0(eq)}</b></span></div>
      ${av >= 100 ? '<span class="pill good">Superado: la ganancia ya cubre los gastos</span>' : `<span class="pill warn">Faltan ${mx0(eq - T.ingreso)} en ventas</span>`}</div>`
      : '<p class="muted">Sin ventas en los últimos 30 días no se puede calcular el margen. Al registrar ventas aparece aquí cuánto hay que vender para cubrir los gastos.</p>'}
    </section>
  </div>
  <h2 class="gap">Todos los gastos</h2>
  <ul class="gl">${lista.map(g => `<li class="gi" data-act="gasto-edit" data-id="${g.id}" tabindex="0"><span class="pill">${esc(g.cat)}</span><div class="gi-m"><b>${esc(g.concepto)}</b><small>${gastoCuando(g)}</small></div><span class="gi-v"><b class="num">${mx0(g.monto)}</b>${g.rec ? '<small>al mes</small>' : ''}</span></li>`).join('')}</ul>`;
}
function gastoDlg(id) {
  const g = id ? byId(S.gastos, id) : { concepto: '', cat: GASTO_CATS[0], monto: '', fecha: dd(0), rec: false, fin: '' };

    <div class="grid2">${fld('Fecha', `<input type="date" name="fecha" required value="${esc(g.fecha)}">`)}${fld('Hasta (opcional)', `<input type="date" name="fin" value="${esc(g.fin || '')}">`, 'Solo si se repite y ya terminó')}</div>
    <label class="chk"><input type="checkbox" name="rec"${g.rec ? ' checked' : ''}><span>Se repite cada mes</span><small>Renta, internet, suscripciones. Se cuenta cada mes desde la fecha.</small></label>

  });
}

/* ============ Insumos: lo que usa una pieza y no es filamento ============ */
const insIc = (s = 20) => `<span class="ins-ic" style="--s:${s}px">${ico('nut', Math.round(s * .6))}</span>`;
function vInsumos() {
  const ls = S.insumos;
  const sel = UI.drw === 'ins' ? byId(ls, UI.ins) : null, bajos = ls.filter(i => stockIns(i.id) <= num(i.minimo)).length;
  const valor = ls.reduce((a, i) => a + Math.max(0, stockIns(i.id)) * num(i.costo), 0);
  const rows = ls.map(i => {
    const st = stockIns(i.id), e = insEstado(i), top = Math.max(num(i.minimo) * 3, st, 1);
    return `<div class="xc${sel && sel.id === i.id ? ' sel' : ''}" data-act="ins-sel" data-id="${i.id}" tabindex="0">
      <div class="xc-h">${insIc(36)}<div class="xc-t"><b>${esc(i.nombre)}</b><small>${mx(i.costo)} por ${esc(i.unidad || 'pza')}</small></div><span class="pill ${e[1]}">${e[0]}</span></div>
      <div class="ins-st"><b class="num">${nf1.format(st)}</b><span>${esc(i.unidad || 'pza')} disponibles</span><span class="mut">aviso en ${nf1.format(num(i.minimo))}</span></div>
      <div class="rk-b ins-b ${e[1]}"><i style="width:${Math.max(0, Math.min(100, st / top * 100))}%"></i><s style="left:${Math.min(100, num(i.minimo) / top * 100)}%"></s></div></div>`;
  }).join('');
  return `${head('Insumos', ls.length ? `<b>${ls.length}</b> ${ls.length === 1 ? 'insumo' : 'insumos'} · Valor en inventario: <b>${mx0(valor)}</b> · Por reponer: <b>${bajos}</b>.` : 'Argollas, cajas, imanes, bolsas.', `<button class="btn primary" data-act="ins-new">${ico('plus', 16)}Nuevo insumo</button>`)}
  <div class="xlist grid">${rows || emptyCard('Aquí van las cosas que no son filamento pero cuestan y se acaban: argollas, cajas, imanes, bolsas. Al ligarlas a una pieza, su costo entra solo en el precio.', `<button class="btn primary" data-act="ins-new">${ico('plus', 16)}Crear el primer insumo</button>`)}</div>`;
}

      save(); toast('Movimiento guardado'); render();

/* ============ Impresoras: trabajo, inversión recuperada y mantenimiento ============ */
function vImpresoras() {
  const inv = inversion(), pend = mantPend(), hTot = S.impresoras.reduce((a, i) => a + num(i.horas), 0);
  const pedLink = e => { const p = e.pedido && byId(S.pedidos, e.pedido); return p ? `<button type="button" class="link" data-act="ped-open" data-id="${p.id}">Pedido #${p.folio} · ${esc(clienteN(p.cliente))}</button>` : '<span class="mut">Trabajo suelto</span>'; };
  const cards = S.impresoras.map(i => {
    const maq = i.costo / i.vidaH + i.mantoH, luz = i.kw * S.config.kwh, vida = Math.min(100, i.horas / i.vidaH * 100), cola = i.cola || [], act = cola[0], ocupada = impEstado(i) === 'imprimiendo';
    const j = act ? jobInfo(act) : null, ro = inv.porImp.find(x => x.i.id === i.id) || { aporte: 0, pct: 0 };
    const trabajo = act ? `<div class="bay2"><span class="lay sm s${forma(act.id)} printing" style="--p:${j.pct}%"></span><div class="bay-m"><div class="bay-t"><b>${esc(act.texto)}</b><span class="num">${j.pct}%</span></div><div class="prog soft"><i style="width:${j.pct}%"></i></div><small>Quedan ${durMin(j.resta)} · ${pedLink(act)}</small></div></div>`
      : '<div class="bay2 idle"><span class="lay sm s0 empty"></span><div><b>Libre</b><small>Aquí aparece el trabajo que se le asigna al poner un pedido en producción.</small></div></div>';
    const q = cola.slice(1).map((e, k) => { const w = j.resta + cola.slice(1, k + 1).reduce((a, x) => a + x.min, 0); return `<li><div><b>${esc(e.texto)}</b><small class="blk">${pedLink(e)}</small></div><span class="mut">inicia en ~${durMin(w)}</span></li>`; }).join('');
    const mant = (i.mant || []).map(t => {
      const m = mantEstado(i, t);
      return `<li><div class="mt-m"><b>${esc(t.tarea)}</b><small>Cada ${nf1.format(t.cadaH)} h · ${t.fecha ? 'última vez ' + fDate(t.fecha) : 'sin registro'}</small><div class="rk-b ${m.est[1]}"><i style="width:${Math.min(100, m.uso * 100)}%"></i></div></div>
        <div class="mt-r"><span class="pill ${m.est[1]}">${m.falta <= 0 ? 'Pasó ' + nf1.format(-m.falta) + ' h' : 'Faltan ' + nf1.format(m.falta) + ' h'}</span><button type="button" class="btn sm" data-act="mant-hecho" data-id="${i.id}" data-t="${t.id}">Hecho</button><button type="button" class="btn sm ghost icon" data-act="mant-edit" data-id="${i.id}" data-t="${t.id}" aria-label="Editar tarea">${ico('edit', 14)}</button></div></li>`;
    }).join('');
    return `<article class="pc2${ocupada ? ' on' : ''}"><header><div><h2>${esc(i.nombre)}</h2><small>${mx0(i.costo)}${i.compra ? ' · comprada el ' + fDate(i.compra) : ''}</small></div>${chip(ocupada ? 'Imprimiendo' : 'Libre', ocupada ? 'info' : 'good')}</header>
      ${trabajo}
      ${q ? `<div><span class="k">En cola · ${cola.length - 1}</span><ul class="cola">${q}</ul></div>` : ''}
      <div class="pc-sec"><div class="pc-h"><b>Inversión recuperada</b><span class="num ${ro.pct >= 100 ? 'pos' : ''}">${pct(ro.pct)}</span></div>
        <div class="rk-b"><i style="width:${Math.max(1.5, ro.pct)}%"></i></div>
        <small>${mx0(ro.aporte)} de ${mx0(i.costo)}. Es un estimado: la ganancia después de gastos se reparte según las horas que trabajó cada impresora.</small></div>
      <div class="pc-sec"><div class="pc-h"><b>Mantenimiento</b><span class="mut num">${nf1.format(i.horas)} h impresas</span></div>
        ${mant ? `<ul class="mt-l">${mant}</ul>` : '<small>Sin tareas. Agrega las que quieras revisar cada tantas horas.</small>'}
        <div><button type="button" class="btn sm ghost" data-act="mant-new" data-id="${i.id}">${ico('plus', 14)}Agregar tarea</button></div></div>
      <dl class="dl"><div><dt>Costo por hora</dt><dd class="num">${mx(maq + luz)} <small>${mx(maq)} máquina + ${mx(luz)} luz</small></dd></div><div><dt>Vida útil gastada</dt><dd class="num">${pct(vida)} <small>de ${nf1.format(i.vidaH)} h</small></dd></div></dl>
      <footer>${act ? `<button class="btn sm primary" data-act="imp-fin" data-id="${i.id}">Terminó este trabajo</button>` : ''}<button class="btn sm" data-act="imp-edit" data-id="${i.id}">Editar costos</button></footer></article>`;
  }).join('');
  return `${head('Impresoras', '', `<button class="btn primary" data-act="imp-new">${ico('plus', 16)}Agregar impresora</button>`)}
  ${S.impresoras.length ? sumLine(`${S.impresoras.length === 1 ? 'La impresora costó' : 'Las ' + S.impresoras.length + ' impresoras costaron'} <b>${mx0(inv.equipo)}</b> y ya ${S.impresoras.length === 1 ? 'recuperó' : 'recuperaron'} <b class="${inv.rec >= 100 ? 'g' : ''}">${pct(inv.rec)}</b> con la ganancia acumulada de <b>${mx0(inv.neta)}</b> (ventas menos gastos). Llevan <b>${nf1.format(hTot)} h</b> impresas. ${pend.length ? `Hay <b class="r">${pend.length}</b> ${pend.length === 1 ? 'tarea de mantenimiento por hacer' : 'tareas de mantenimiento por hacer'}.` : 'El mantenimiento está al día.'}`, `<div class="rk-b big mt" role="img" aria-label="${Math.round(inv.rec)}% de la inversión recuperada"><i style="width:${Math.min(100, Math.max(1.5, inv.rec))}%"></i></div><p class="hint">Inversión recuperada: ${pct(inv.rec)}</p>`) : ''}

/* ============ Respaldo y exportación ============ */
const KEY_AUTO = 'quickrobot-auto-';
function descargar(nombre, txt, mime) {
  try {
    const a = document.createElement('a'), u = URL.createObjectURL(new Blob([txt], { type: mime || 'text/plain' }));
    a.href = u; a.download = nombre; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(u), 4000);
    return true;
  } catch (e) { return false; }
}
function copiasAuto() {
  const out = [];
  try { for (let k = 0; k < localStorage.length; k++) { const key = localStorage.key(k); if (key && key.startsWith(KEY_AUTO)) out.push({ key, fecha: key.slice(KEY_AUTO.length), kb: Math.round((localStorage.getItem(key) || '').length / 1024) }); } } catch (e) { }
  return out.sort((a, b) => b.fecha.localeCompare(a.fecha));
}
/* una copia por día, se conservan las últimas 7 */
function copiaAuto() {
  try {
    const key = KEY_AUTO + dd(0);
    if (!localStorage.getItem(key)) localStorage.setItem(key, JSON.stringify(S));
    copiasAuto().slice(7).forEach(c => localStorage.removeItem(c.key));
  } catch (e) { }
}
const diasDesdeCopia = () => S.pref.copia ? -daysTo(S.pref.copia) : null;
function copiaManual() {
  const txt = JSON.stringify(S, null, 1);

}
function aplicarRespaldo(txt, aviso) {
  const r = leerRespaldo(txt); if (r.err) { toast(r.err); return false; }
  try { localStorage.setItem(KEY_BAK_REST, JSON.stringify(S)); } catch (e) { }
  S = r.s; draft = cdraft = B = null; CURPED = null; UI.fil = UI.ex = UI.cli = UI.ins = UI.drw = null; CURCLI = null; UI.canal = 'todos';
  save(); toast(aviso || 'Respaldo restaurado.'); go('inicio'); return true;

function confirmarRespaldo(txt, origen) {
  const r = leerRespaldo(txt); if (r.err) { toast(r.err); return; }
  openDlg('Restaurar copia', `<p>${esc(origen)}: <b>${r.s.productos.length}</b> piezas, <b>${r.s.clientes.length}</b> clientes, <b>${r.s.pedidos.length}</b> pedidos y <b>${r.s.ventas.length}</b> ventas.</p><p class="note">Reemplaza todos los datos actuales. Antes se guarda una copia de seguridad de lo que hay ahora.</p>`, { submit: 'Restaurar', onSubmit: () => { aplicarRespaldo(txt); } });

function leerArchivoRespaldo(inp) {
  const f = inp.files && inp.files[0]; if (!f) return;
  const fr = new FileReader(); fr.onerror = () => toast('No se pudo leer el archivo.');
  fr.onload = () => { confirmarRespaldo(String(fr.result || ''), f.name); inp.value = ''; };
  fr.readAsText(f);
}

/* al abrir, el calendario va al mes de la próxima entrega pendiente (si este mes ya no tiene) */

  const e = act.find(x => x >= hoy) || act[0], [y, m] = e.split('-').map(Number);

}
function pedCalendario() {

  const fin = new Date(base.getFullYear(), base.getMonth() + 1, 0), semanas = Math.ceil(((base.getDay() + 6) % 7 + fin.getDate()) / 7);
  const ps = S.pedidos.filter(p => p.estado !== 'cancelado'), mes = ps.filter(p => p.entrega.slice(0, 7) === iso(base).slice(0, 7));
  const act = mes.filter(pedActivo), tot = act.reduce((a, p) => a + pedTotal(p), 0), atras = S.pedidos.filter(p => pedActivo(p) && daysTo(p.entrega) < 0).length;

  }
  return `<div class="cal-h"><div><h2>${titulo.charAt(0).toUpperCase() + titulo.slice(1)}</h2><p class="muted">${act.length ? `<b>${act.length}</b> ${act.length === 1 ? 'entrega pendiente' : 'entregas pendientes'} este mes por <b>${mx0(tot)}</b>.` : 'Sin entregas pendientes este mes.'}${atras ? ` <b class="r">${atras}</b> ${atras === 1 ? 'pedido retrasado' : 'pedidos retrasados'}.` : ''}</p></div>
    <div class="btnrow"><button type="button" class="btn sm" data-act="cal-mes" data-d="-1" aria-label="Mes anterior">${ico('back', 14)}</button><button type="button" class="btn sm" data-act="cal-mes" data-d="0">Hoy</button><button type="button" class="btn sm" data-act="cal-mes" data-d="1" aria-label="Mes siguiente"><span class="flip">${ico('back', 14)}</span></button></div></div>

const NAV = [[null, ['inicio']], ['Vender', ['productos', 'ventas', 'pedidos']], ['Taller', ['filamentos', 'insumos', 'impresoras', 'produccion', 'existencias', 'compras']], ['Negocio', ['clientes', 'gastos', 'reportes', 'ajustes']]];
const padreDe = r => { const R = ROUTES[r]; return R && R.sub ? (typeof R.padre === 'function' ? R.padre() : R.padre) : r; };

function buildNav() {
  $('#nav').innerHTML = NAV.map(([g, items]) => {
    const vis = items.filter(visible); if (!vis.length) return '';
    return `<div class="ng">${g ? `<span class="ngl">${g}</span>` : ''}${vis.map(r => {
      const R = ROUTES[r], cur = padreDe(CUR) === r;
      return `<a href="#${r}" data-act="go" data-r="${r}"${cur ? ' aria-current="page"' : ''}>${ico(R.ic, 18)}<span>${R.t}</span>${R.f !== 'nucleo' ? `<em class="phc">${R.f === 'pronto' ? 'pronto' : 'después'}</em>` : ''}</a>`;
    }).join('')}</div>`;
  }).join('');
  $('#side-foot').innerHTML = `<small class="loc">Datos de ejemplo guardados en esta computadora. No usa servidor.</small>`;
}
function render() {
  let r = ROUTE;
  if (!ROUTES[r]) r = 'inicio';
  if (!visible(r)) r = 'inicio';
  if (r === 'nuevo' && !B) r = 'ventas';
  if (r === 'pedido' && !byId(S.pedidos, CURPED)) r = 'pedidos';
  if (r === 'cliente' && !byId(S.clientes, CURCLI)) r = 'clientes';
  ROUTE = CUR = r;
  $('#view').innerHTML = ROUTES[r].v();
  { const m = $('#main'); m.classList.toggle('pn-s', !!$('#view > .split')); m.classList.toggle('pn-e', !!$('#view > .ed')); m.classList.toggle('pn-p', !!$('#view > .cols2.pd')); }
  paintDrw();
  buildNav();
  $('#main').scrollTop = 0;
  document.body.classList.remove('nav-open');
  if (ROUTES[r].after) ROUTES[r].after();
}

function go(r) {
  ROUTE = r;
  try { if (location.hash !== '#' + r) location.hash = r; } catch (e) { }
  render();
}

  'mant-hecho': b => mantHechoDlg(b.dataset.id, b.dataset.t),
  'mant-del': b => { if (!dosToques(b, '¿Quitar?')) return; const i = byId(S.impresoras, b.dataset.id); if (i) i.mant = (i.mant || []).filter(t => t.id !== b.dataset.t); save(); dlg.close(); toast('Tarea quitada'); render(); },
  'bak-dl': () => copiaManual(),
  'auto-rest': b => { try { confirmarRespaldo(localStorage.getItem(b.dataset.k) || '', 'Copia del ' + fDate(b.dataset.k.slice(KEY_AUTO.length))); } catch (e) { toast('No se pudo leer la copia.'); } },
  'exp-csv': b => exportarCsv(b.dataset.k, false),
  'exp-copy': () => exportarCsv($('#exp-sel').value, true),
  'vista': b => { UI.vista = b.dataset.v; render(); },
  'ex-sel': b => drwOpen('ex', b.dataset.id),
  'ex-ajuste': b => ajusteDlg(b.dataset.id),
  'ex-on': () => stockOnDlg(),
  /* clientes */
  'cli-new': () => clienteDlg(),
  'cli-edit': b => clienteDlg({ id: b.dataset.id }),
  'cli-edit-b': b => clienteDlg({ id: b.dataset.id, after: () => refreshCliB() }),
  'cli-open': (b, e) => { if (e && e.preventDefault) e.preventDefault(); if (dlg.open) dlg.close(); CURCLI = b.dataset.id; go('cliente'); },
  'cli-copy': b => { const c = byId(S.clientes, b.dataset.id); if (c && c.tel) copyText(c.tel, 'Contacto copiado.'); },
  'cli-ped': b => { if (sinPiezas()) return; newB('pedido', { cli: b.dataset.id }); },
  'cli-venta': b => { if (sinPiezas()) return; newB('venta', { cli: b.dataset.id }); },
  'cli-del': b => {
    const c = byId(S.clientes, b.dataset.id); if (!c) return;
    if (cliPedidos(c.id).length || cliVentas(c.id).length) { toast('Ese cliente tiene pedidos o ventas y no se puede eliminar.'); return; }
    if (!dosToques(b, 'Toca de nuevo para eliminar')) return;
    S.clientes = S.clientes.filter(x => x.id !== c.id); UI.cli = null; CURCLI = null; save(); toast(`Cliente “${c.nombre}” eliminado.`); go('clientes');
  },
  'cl-logo-quitar': () => { if (!CD) return; CD.img = ''; const f = $('#cl-file'); if (f) f.value = ''; cliLogoPaint(); },
  'canal-add': () => canalAdd(),
  'canal-del': b => canalDel(b),
  'restaurar': () => restaurarDlg(),
  'venta-edit': b => ventaEditDlg(b.dataset.id),
  'pago-del': b => {
    const p = byId(S.pedidos, b.dataset.id); if (!p) return;
    if (!dosToques(b, '¿Quitar?')) return;
    const x = (p.pagos || []).find(y => y.id === b.dataset.pid); if (!x) return;
    p.pagos = p.pagos.filter(y => y.id !== x.id); save(); toast(`Pago de ${mx0(x.monto)} quitado. Saldo del pedido: ${mx0(pedDebe(p))}.`); render();
  },
  'prod-open': b => prodDlg(b.dataset.id),
  'prod-del': b => {
    const x = byId(S.imps, b.dataset.id); if (!x) return;
    const bloq = impBloqueo(x); if (bloq) { toast(bloq); return; }
    if (!dosToques(b, 'Toca de nuevo para eliminar')) return;
    const r = quitarImp(x); save(); dlg.close();
    toast('Registro eliminado.' + (r.g > 0 ? ` Se devolvieron ${gfmt(r.g)} al inventario de filamento.` : r.sinMovs ? ' El filamento descontado no se devuelve (registro anterior); se puede ajustar en Filamentos.' : '') + (r.pz ? ` Se quitaron ${r.pz} ${r.pz === 1 ? 'pieza' : 'piezas'} de Existencias.` : '') + (r.h > 0 ? ` Se restaron ${nf1.format(r.h)} h a ${r.imp}.` : '')); render();
  },
  'imp-del': b => {
    const i = byId(S.impresoras, b.dataset.id); if (!i) return;
    const cola = (i.cola || []).length;
    if (cola) { toast(`No se puede eliminar: ${i.nombre} tiene ${cola} ${cola === 1 ? 'trabajo' : 'trabajos'} en cola. Primero terminarlos o reasignarlos.`); return; }
    if (!dosToques(b, 'Toca de nuevo para eliminar')) return;
    S.impresoras = S.impresoras.filter(x => x.id !== i.id);
    const resto = S.impresoras, nueva = resto.length === 1 ? resto[0].id : resto.length ? '*' : '';
    const refs = S.productos.filter(p => p.imp === i.id); refs.forEach(p => { p.imp = nueva; });
    save(); dlg.close();
    toast(`Impresora “${i.nombre}” eliminada.` + (refs.length ? ` ${refs.length} ${refs.length === 1 ? 'pieza usa' : 'piezas usan'} ahora ${nueva === '*' ? 'el promedio de las impresoras' : resto.length ? resto[0].nombre : 'un costo de máquina de $0'} como referencia.` : '') + ' El historial de producción se conserva.'); render();
  },
  'export': () => copyText(JSON.stringify(S, null, 1), 'Respaldo copiado. Pégalo en un archivo para guardarlo.'),
  'demo-reset': () => { S = seed(); save(); draft = cdraft = B = null; CURPED = null; toast('Datos de ejemplo restaurados'); go('inicio'); },
  'demo-clear': b => {
    if (!dosToques(b, 'Toca de nuevo para borrar todo')) return;
    const s = seed(); S = { v: 7, config: s.config, cat: catBase(), filamentos: [], rollos: [], movs: [], pmovs: [], impresoras: [], productos: [], colecciones: [], clientes: [], pedidos: [], imps: [], ventas: [], insumos: [], imovs: [], gastos: [], pref: S.pref };
    save(); draft = cdraft = B = null; CURPED = null; toast('Datos vaciados. Agregar rollos e impresoras para comenzar.'); go('filamentos');
  }
};

document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const f = ACT[b.dataset.act]; if (f) f(b, e);
});
document.addEventListener('keydown', e => {
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches && e.target.matches('tr.click, .kcard[data-act], .pt[data-act], .xc[data-act], .gi[data-act], .rkx li[data-act]')) { e.preventDefault(); e.target.click(); }
  if (e.key === 'Escape') document.body.classList.remove('nav-open');
});
document.addEventListener('input', e => {
  const el = e.target;
  if (el.dataset.f) return onField(el);
  if (el.dataset.c) return onColField(el);
  if (el.dataset.b) return onB(el);
  if (el.dataset.p) { const p = byId(S.pedidos, CURPED); if (p && el.dataset.p === 'nota') { p.nota = el.value; save(); } return; }
  if (el.id === 'q-prod') { UI.q = el.value; $('#prod-rows').innerHTML = UI.cat === 'colecciones' ? colRows() : prodRows(); return; }
  if (el.dataset.neg) { S.config.negocio[el.dataset.neg] = el.dataset.neg === 'vigencia' ? Math.max(0, Math.round(num(el.value))) : el.value; save(); return; }
  if (el.dataset.cfg) { S.config[el.dataset.cfg] = Math.max(0, num(el.value)); save(); const p = $('#cfg-prev'); if (p) p.innerHTML = cfgPrev(); return; }
  if (el.dataset.canal === 'c') { const c = S.config.canales[+el.dataset.i]; if (c) { c.c = Math.max(0, num(el.value)); save(); } }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'cl-file') return cliLogoArchivo(t);
  if (t.id === 'pf-file') return fotoArchivo(t);
  if (t.id === 'rb-file') return leerArchivoRespaldo(t);
  if (t.dataset && t.dataset.canal === 'n') return canalRename(t);
  if (t.dataset && t.dataset.b === 'uso' && B) { bCalc(); const l = B.lines[+t.dataset.i]; if (l) t.value = (l.uso && l.uso[t.dataset.p]) || 0; return; }
  if (t.dataset && t.dataset.p && t.dataset.p !== 'nota') { const p = byId(S.pedidos, CURPED); if (p) { p[t.dataset.p] = t.value; save(); render(); } return; }
});
dlg.addEventListener('click', e => { if (e.target === dlg) dlg.close(); });
$('#pal').addEventListener('click', e => { if (e.target === $('#pal')) $('#pal').close(); });
dlg.addEventListener('close', () => { const back = CD && !CD.done && CD.back; CD = null; if (back) setTimeout(back, 0); });

/* globo de datos al pasar sobre las barras */
const tip = $('#tip');
function placeTip(x, y) {
  const w = tip.offsetWidth, h = tip.offsetHeight;
  tip.style.left = Math.max(8, Math.min(innerWidth - w - 8, x + 12)) + 'px';
  tip.style.top = Math.max(8, Math.min(innerHeight - h - 8, y + 16)) + 'px';
}
document.addEventListener('pointermove', e => {
  const t = e.target.closest && e.target.closest('[data-tip]');
  if (!t) { tip.hidden = true; return; }
  tip.textContent = t.dataset.tip; tip.hidden = false; placeTip(e.clientX, e.clientY);
});
document.addEventListener('focusin', e => {
  const t = e.target.closest && e.target.closest('[data-tip]'); if (!t) return;
  const r = t.getBoundingClientRect(); tip.textContent = t.dataset.tip; tip.hidden = false; placeTip(r.left, r.top - 30);
});
document.addEventListener('focusout', () => { tip.hidden = true; });
document.addEventListener('pointerleave', () => { tip.hidden = true; });

window.addEventListener('hashchange', () => { let r = ''; try { r = location.hash.slice(1); } catch (e) { } if (ROUTES[r] && r !== ROUTE) { ROUTE = r; render(); } });
S = load() || seed(); save();
try { const h0 = location.hash.slice(1); if (ROUTES[h0] && !ROUTES[h0].sub) ROUTE = h0; } catch (e) { }
$('#brand-mk').innerHTML = mascot(40); $('#top-mk').innerHTML = mascot(28);
copiaAuto();
render();
if (MIG_FALLO) setTimeout(() => toast('No se pudieron actualizar los datos anteriores. Quedaron en una copia de respaldo y se cargaron los datos de ejemplo.'), 500);

})();
</script>
</body>
</html>
