<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>Quick Robot</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&display=swap">
<style>
:root {
  /* Layout: barra lateral fija y área de trabajo. La calculadora se parte en dos (datos | resultado) y el resultado siempre pone el costo junto al precio: lo morado es costo, lo verde es ganancia. Estilo de marca Quick Robot: fondo blanco, tinta #121214, morado #6b3fd4, verde #00ae42, letra Geist. */
  --bg: #ffffff; --panel: #f6f6f8; --panel-2: #ececf1;
  --ink: #121214; --ink-2: #6a6a73; --ink-3: #777782;
  --line: #e7e7ec; --line-2: #d2d2da;
  --purple: #6b3fd4; --purple-soft: #efe9fd; --btn: #121214; --btn-ink: #ffffff; --on-green: #121214;
  --green: #00ae42; --green-ink: #067a30; --green-soft: #e3f5e9;
  --amber: #e9a817; --amber-ink: #86500a; --amber-soft: #fff1d3;
  --red: #d6334f; --red-ink: #b3223f; --red-soft: #fde8ec;
  --blue: #3f86c9; --c-m: #4c28a8; --c-l: #6b3fd4; --c-q: #9b7de6; --c-t: #c4b2f2; --c-e: #e0d7f8; --c-f: #8b8b96;
  --sh: 0 1px 2px rgba(18, 18, 20, .07);
  --r: 5px;   /* radio de tarjetas y paneles: poco, como una pieza de taller */
  --font-display: 'Geist', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --font-body: 'Geist', system-ui, -apple-system, 'Segoe UI', sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.45; -webkit-font-smoothing: antialiased; }
[hidden] { display: none !important; }
h1, h2, h3 { font-family: var(--font-display); margin: 0; letter-spacing: -.03em; text-wrap: balance; }
h1 { font-size: 28px; line-height: 1.1; font-weight: 600; letter-spacing: -.04em; }
h2 { font-size: 18px; font-weight: 600; }
h3 { font-size: 14px; font-weight: 600; margin: 18px 0 6px; }
p { margin: 0; }
a { color: var(--purple); }
small { font-size: 12.5px; color: var(--ink-3); }
small.blk { display: block; }
b { font-weight: 600; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--purple); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.num { font-variant-numeric: tabular-nums; }
.pos { color: var(--green-ink); } .neg { color: var(--red-ink); } .mut { color: var(--ink-3); }
.muted { color: var(--ink-2); margin-top: 4px; max-width: 62ch; }
.ic { flex: none; }

/* ---------- estructura ---------- */
.app { display: grid; grid-template-columns: 248px minmax(0, 1fr); height: 100%; }
.side { background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; gap: 14px; padding: 16px 12px 14px; padding-left: max(12px, env(safe-area-inset-left, 0px)); overflow-y: auto; min-height: 0; }
.brand { display: flex; align-items: center; gap: 10px; padding: 2px 6px; }
.brand b { font-family: var(--font-display); font-size: 21px; font-weight: 600; letter-spacing: -.03em; line-height: 1; }
.brand small { display: block; margin-top: 3px; }
.nav { display: flex; flex-direction: column; gap: 14px; flex: 1; }
.ng { display: flex; flex-direction: column; gap: 2px; }
.ngl { font-size: 12.5px; color: var(--ink-3); font-weight: 600; padding: 0 10px 3px; }
.nav a { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 9px; color: var(--ink-2); text-decoration: none; font-weight: 500; }
.nav a:hover { background: var(--panel-2); color: var(--ink); }
.nav a[aria-current="page"] { background: var(--purple-soft); color: var(--purple); font-weight: 600; }
.phc { margin-left: auto; font-style: normal; font-size: 11.5px; color: var(--ink-3); border: 1px solid var(--line-2); border-radius: 99px; padding: 0 7px; }
.side-foot { display: grid; gap: 6px; padding: 12px 8px 0; border-top: 1px solid var(--line); }
.side-foot .loc { line-height: 1.35; }
.switch { display: flex; align-items: center; gap: 9px; font-weight: 600; cursor: pointer; }
.switch input { accent-color: var(--purple); width: 18px; height: 18px; margin: 0; }
.switch.big { font-size: 16px; margin-bottom: 6px; }
.main { overflow-y: auto; min-width: 0; min-height: 0; }
.page { max-width: 1160px; margin: 0 auto; padding-block: 28px 72px; padding-left: max(28px, env(safe-area-inset-left, 0px)); padding-right: max(28px, env(safe-area-inset-right, 0px)); outline: none; }
.topbar { display: none; }
.scrim { display: none; }
.ph { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px 24px; flex-wrap: wrap; margin-bottom: 22px; }
.ph > div:first-child { flex: 1 1 320px; min-width: 0; }
.ph h1 { display: flex; align-items: center; gap: 12px; }
.ph .sub { max-width: 58ch; color: var(--ink-2); margin-top: 8px; }
.ph-a { display: flex; gap: 8px; flex-wrap: wrap; }
.crumbs { display: flex; gap: 8px; color: var(--ink-3); font-size: 13.5px; margin-bottom: 14px; }
.crumbs a { color: var(--ink-2); }

/* ---------- botones y campos ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; border: 1px solid var(--line-2); background: var(--bg); color: var(--ink); padding: 8px 14px; border-radius: 6px; font-weight: 500; cursor: pointer; min-height: 38px; text-decoration: none; }
.btn:hover { background: var(--panel); border-color: var(--ink-3); }
.btn.primary { background: var(--btn); color: var(--btn-ink); border-color: var(--btn); }
.btn.primary:hover { filter: brightness(1.45); }
.btn.green { background: var(--green); color: var(--on-green); border-color: var(--green); }
.btn.green:hover { background: var(--green); border-color: var(--green); filter: brightness(1.08); }
.btn.ghost { border-color: transparent; background: transparent; color: var(--ink-2); }
.btn.ghost:hover { background: var(--panel-2); }
.btn.danger { color: var(--red-ink); }
.btn.sm { min-height: 32px; padding: 4px 11px; font-size: 13.5px; }
.btn.block { width: 100%; }
.btn.icon { padding: 0; width: 34px; min-height: 34px; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.link { background: none; border: 0; padding: 0; color: var(--purple); font-weight: 600; text-decoration: underline; cursor: pointer; }
input, select, textarea { font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line-2); border-radius: 6px; padding: 8px 10px; min-height: 38px; width: 100%; min-width: 0; }
textarea { resize: vertical; line-height: 1.4; }
input[type="color"] { padding: 3px; }
input[type="checkbox"], input[type="radio"] { width: auto; min-height: 0; }
.fld { display: grid; gap: 4px; min-width: 0; align-content: start; }
.fld > span:first-child { font-size: 13px; font-weight: 600; color: var(--ink-2); }
.fld small { line-height: 1.3; }
.unit { display: flex; align-items: center; border: 1px solid var(--line-2); border-radius: 6px; background: var(--bg); min-width: 0; }
.unit:focus-within { outline: 2px solid var(--purple); outline-offset: 1px; }
.unit input { border: 0; outline: none; background: transparent; min-height: 36px; text-align: left; }
.unit i { font-style: normal; color: var(--ink-3); padding-right: 10px; font-size: 13.5px; white-space: nowrap; }
.unit i.pre { padding: 0 0 0 12px; font-size: 22px; font-family: var(--font-display); font-weight: 600; color: var(--ink-2); }
.unit.big input { font-family: var(--font-display); font-size: 30px; font-weight: 600; letter-spacing: -.02em; min-height: 48px; }
.grid2, .grid3, .grid4 { display: grid; gap: 12px 14px; }
.grid2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.grid3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.grid4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.hm { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.seg { display: inline-flex; flex-wrap: wrap; gap: 4px 22px; padding: 0; background: none; border-bottom: 1px solid var(--line-2); }
.seg button { border: 0; border-bottom: 2px solid transparent; margin-bottom: -1px; background: transparent; padding: 8px 2px 9px; border-radius: 0; font-weight: 600; color: var(--ink-2); cursor: pointer; display: block; text-align: center; }
.seg button:hover { color: var(--ink); }
.rad span { border: 1px solid var(--line-2); background: var(--bg); padding: 6px 13px; border-radius: 6px; font-weight: 600; color: var(--ink-2); cursor: pointer; display: block; text-align: center; }
.seg button.on { color: var(--ink); border-bottom-color: var(--ink); }
.rad input:checked + span { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.seg button small { margin-left: 4px; }
.seg.wide { display: flex; gap: 4px 0; }
.seg.wide > * { flex: 1; }
.rad { position: relative; display: block; }
.rad input { position: absolute; opacity: 0; inset: 0; }
.rad input:focus-visible + span { outline: 2px solid var(--purple); outline-offset: 1px; }
.toolbar { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; margin-bottom: 14px; }
.search { width: min(260px, 100%); }
.tags { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0 14px; }
.tag { border: 1px solid var(--line-2); background: var(--bg); border-radius: 4px; padding: 3px 11px; cursor: pointer; font-size: 13.5px; color: var(--ink-2); font-weight: 500; }
.tag:hover { border-color: var(--ink-3); color: var(--ink); }
.tag.on { background: var(--ink); border-color: var(--ink); color: var(--bg); font-weight: 600; }
.chip { --c: var(--ink-3); display: inline-flex; align-items: center; font-size: 12.5px; font-weight: 600; border-radius: 3px; padding: 1px 8px 1px 7px; background: var(--panel); color: var(--ink); border-left: 3px solid var(--c); white-space: nowrap; }
.chip.info { --c: var(--purple); }
.chip.good { --c: var(--green); }
.chip.warn { --c: var(--amber); }
.chip.bad { --c: var(--red); background: var(--red-soft); color: var(--red-ink); }

/* ---------- tablas y listas ---------- */
.tw { overflow-x: auto; position: relative; }
.tbl { width: 100%; border-collapse: collapse; }
.tbl:not(.sm) { min-width: 640px; }
.tbl th { font-size: 12.5px; color: var(--ink-2); font-weight: 600; text-align: left; padding: 8px 10px; border-bottom: 2px solid var(--ink); white-space: nowrap; }
.tbl td { padding: 10px; border-bottom: 1px dotted var(--line-2); vertical-align: middle; }
.tbl.sm td { padding: 7px 10px; } .tbl.sm { font-size: 14px; }
.tbl .r { text-align: right; }
.tbl td.nw, .tbl td.r small.blk { white-space: nowrap; }
.tbl tr.click { cursor: pointer; }
.tbl tr.click:hover td, .tbl tr.sel td { background: var(--panel); }
.tbl tr.click:hover td:first-child, .tbl tr.sel td:first-child { box-shadow: inset 3px 0 0 var(--purple); }
.tbl tr.tot td { font-weight: 600; border-top: 3px double var(--ink); border-bottom: 0; }
.tbl .bar-td { width: 140px; } .tbl .bar-th { width: 140px; }
/* catálogo: los encabezados largos se parten en dos líneas para que la tabla quepa sin recortar los botones */
.tbl.prods th { white-space: normal; vertical-align: bottom; line-height: 1.25; }
.tbl.prods th.nw { white-space: nowrap; }
.tbl.prods .bar-td, .tbl.prods .bar-th { width: 112px; }
.tbl.prods .mbar { width: 100%; min-width: 80px; }
.empty-td, .empty-box { text-align: center; padding: 36px 12px !important; color: var(--ink-2); }
.empty-td p, .empty-box p { margin: 8px 0 14px; }
.pn { display: flex; align-items: center; gap: 10px; }
.pn small { display: block; }
.sw { display: inline-block; width: 14px; height: 14px; border-radius: 50%; background: var(--c); box-shadow: inset 0 0 0 1px rgba(32, 26, 54, .28); flex: none; }
.sw.lg { width: 22px; height: 22px; }
.swstack { display: inline-flex; padding-left: 6px; flex: none; }
.swstack .sw { width: 20px; height: 20px; margin-left: -6px; border: 2px solid var(--bg); box-shadow: inset 0 0 0 1px rgba(32, 26, 54, .25); }
.av { width: 34px; height: 34px; border-radius: 10px; background: var(--purple-soft); color: var(--purple); display: grid; place-items: center; font-weight: 600; font-family: var(--font-display); flex: none; }
.av.logo { background: #fff; border: 1px solid var(--line); padding: 3px; overflow: hidden; }
.av.logo img { width: 100%; height: 100%; object-fit: contain; display: block; }
.det-h .av { width: 46px; height: 46px; border-radius: 12px; font-size: 16px; }
.det-h > div { min-width: 0; }
.logo-row { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
.lg-prev { width: 88px; height: 88px; border: 1px dashed var(--line-2); border-radius: 12px; display: grid; place-items: center; background: var(--panel); overflow: hidden; font-size: 13px; text-align: center; flex: none; }
.lg-prev img { width: 100%; height: 100%; object-fit: contain; background: #fff; display: block; }
.lg-ctl { display: grid; gap: 8px; justify-items: start; min-width: 0; }
.lg-ctl .hint { margin: 0; }
.cli-mini { margin: 6px 0 0; font-size: 13px; color: var(--ink-3); line-height: 1.4; }
.cli-card { display: flex; gap: 10px; align-items: center; margin-bottom: 8px; }
.cli-card > div { min-width: 0; }
.det-z { margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--line); }
.det-z .hint { margin: 0; }
.hist td:first-child { white-space: nowrap; }
.fl-u { list-style: none; margin: 6px 0 12px; padding: 0; display: grid; gap: 6px; }
.fl-u li { display: flex; align-items: center; gap: 8px; }
.fl-u li b { margin-left: auto; }
.quitar { font-size: 13px; font-weight: 500; color: var(--ink-3); }
.hist td small.blk { white-space: normal; max-width: 30ch; }
.mbar { display: flex; gap: 2px; width: 120px; height: 10px; border-radius: 2px; overflow: hidden; background: var(--panel-2); }
.mbar i { display: block; height: 100%; }
.mbar .c { background-color: var(--c-l); } .mbar .g { background-color: var(--green); }
.mbar.loss .c { background-color: var(--red); }
.foot-note { color: var(--ink-3); font-size: 13px; margin-top: 12px; max-width: 70ch; }
.strip { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 0; border-top: 2px solid var(--ink); border-bottom: 1px solid var(--line-2); margin: 0 0 28px; }
.strip > div { padding: 13px 18px 13px 0; display: grid; gap: 1px; align-content: start; }
.strip > div + div { padding-left: 18px; border-left: 1px dotted var(--line-2); }
.k { font-size: 13px; color: var(--ink-2); font-weight: 600; }
.v { font-family: var(--font-display); font-size: 28px; font-weight: 500; letter-spacing: -.03em; line-height: 1.15; font-variant-numeric: tabular-nums; }
.s { font-size: 12.5px; color: var(--ink-3); }
.cols2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 36px; margin-bottom: 32px; }
.gap { margin-top: 26px; }
.hb + .note { margin-top: 16px; }
.split .tbl:not(.sm) { min-width: 540px; }
.tbl.sm td:first-child { white-space: nowrap; }
.tbl.items td:first-child { white-space: normal; min-width: 160px; }
.tbl.items td small.blk { white-space: normal; max-width: 34ch; }
.tbl.items td.r, .tbl.items th.r { white-space: nowrap; }
.hb { list-style: none; margin: 14px 0 0; padding: 0; display: grid; gap: 10px; }
.hb li { display: grid; grid-template-columns: minmax(90px, 40%) 1fr auto auto; gap: 10px; align-items: center; }
.hb .hb-l { font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hb .hb-t { height: 14px; display: flex; }
.hb .hb-t i { display: block; height: 100%; background-color: var(--green); border-radius: 0 2px 2px 0; transition: width .25s; }
.hb .hb-t i.pu { background-color: var(--c-l); }
.hb .hb-v { font-weight: 600; font-variant-numeric: tabular-nums; min-width: 4.5em; text-align: right; }
.hb .hb-x { font-size: 12.5px; color: var(--ink-3); min-width: 2.6em; font-variant-numeric: tabular-nums; }
.hb li:has(.hb-v:last-child) { grid-template-columns: minmax(90px, 40%) 1fr auto; }
.att { list-style: none; margin: 12px 0 0; padding: 0; display: grid; gap: 8px; }
.att li { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: start; padding: 10px 12px; background: var(--panel); border-left: 3px solid var(--amber); color: var(--ink); border-radius: 0 5px 5px 0; font-size: 14px; }
.att li .ic { margin-top: 2px; color: var(--amber-ink); }
.att a { color: inherit; font-weight: 600; white-space: nowrap; }
.job { margin-top: 12px; display: grid; gap: 6px; }
.job-h { display: flex; justify-content: space-between; gap: 8px; }
.job-h span { color: var(--ink-3); }
.prog { display: block; height: 8px; background: var(--panel-2); border-radius: 2px; overflow: hidden; }
.prog i { display: block; height: 100%; background-color: var(--purple); border-radius: 0; }
.stk { display: inline-block; width: 92px; height: 8px; background: var(--panel-2); border-radius: 2px; overflow: hidden; vertical-align: middle; }
.stk i { display: block; height: 100%; background-color: var(--c-l); border-radius: 0; }
.stk.low i { background-color: var(--red); }
.stk-td { white-space: nowrap; } .stk-td .stk { margin-right: 10px; }

/* ---------- calculadora ---------- */
.ed { display: grid; grid-template-columns: minmax(0, 1fr) 392px; gap: 32px; align-items: start; }
.ed-form { display: grid; gap: 22px; min-width: 0; }
.title-f input { font-family: var(--font-display); font-size: 26px; font-weight: 600; letter-spacing: -.02em; border: 0; border-bottom: 2px solid var(--line-2); border-radius: 0; padding: 4px 0 8px; background: transparent; }
.title-f input:focus-visible { outline: none; border-color: var(--purple); }
fieldset.blk { border: 0; border-top: 1px solid var(--line); margin: 0; padding: 14px 0 0; min-width: 0; }
fieldset.blk legend { font-family: var(--font-display); font-weight: 600; font-size: 16px; padding: 0 12px 0 0; float: left; width: 100%; margin-bottom: 12px; }
fieldset.blk > * { clear: both; }
.mt { margin-top: 14px; }
.hint { font-size: 13px; color: var(--ink-3); margin-top: 8px; max-width: 64ch; }
.banner { background: var(--purple-soft); color: var(--purple); padding: 10px 14px; border-radius: 10px; margin-bottom: 16px; max-width: 70ch; }
.frow { display: grid; grid-template-columns: auto minmax(0, 1fr) 128px 76px auto; gap: 8px 10px; align-items: center; margin-bottom: 10px; }
.frow.parte { grid-template-columns: minmax(0, 1fr) 70px auto; }
.frow.ro { grid-template-columns: auto minmax(0, 1fr) 130px; }
.frow .stock { grid-column: 2 / -1; margin-top: -4px; }
.frow .stock.bad { color: var(--red-ink); font-weight: 600; }
.fcost { text-align: right; font-weight: 600; }
.ed-res { position: sticky; top: 4px; border: 1px solid var(--line-2); border-top: 2px solid var(--ink); border-radius: 0 0 var(--r) var(--r); padding: 18px; display: grid; gap: 14px; background: var(--bg); box-shadow: 0 10px 30px -18px rgba(18, 18, 20, .35); }
.res-top { display: grid; grid-template-columns: auto 1fr; gap: 16px; align-items: end; }
.res-top b.big { display: block; font-family: var(--font-display); font-size: 34px; font-weight: 600; letter-spacing: -.02em; line-height: 1.1; }
.price { display: grid; gap: 2px; }
#r-dyn { display: grid; gap: 14px; }
.sbar { display: flex; gap: 2px; height: 22px; border-radius: 3px; overflow: hidden; background: var(--panel-2); }
.sbar i { display: block; height: 100%; background-color: var(--s); min-width: 2px; transition: width .25s; }
.sbar i.hatch { background: repeating-linear-gradient(45deg, var(--s) 0 3px, transparent 3px 6px); }
.sbar i.gain { background-color: var(--green); }
.sbar i:hover, .sbar i:focus-visible { filter: brightness(1.15); }
.sbar.loss { box-shadow: 0 0 0 2px var(--red); }
.kpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.kpis > div { display: grid; }
.kpis b { font-family: var(--font-display); font-size: 22px; font-weight: 600; }
.status { --c: var(--ink-3); display: flex; gap: 8px; align-items: flex-start; padding: 9px 12px; border-radius: 0 5px 5px 0; border-left: 3px solid var(--c); background: var(--panel); color: var(--ink); font-size: 14px; }
.status.good { --c: var(--green); }
.status.warn { --c: var(--amber); }
.status.bad { --c: var(--red); background: var(--red-soft); color: var(--red-ink); }
.status.info { --c: var(--purple); }
.status .ic { margin-top: 2px; color: var(--c); }
.note { font-size: 13.5px; color: var(--ink-2); background: var(--panel); border-left: 3px solid var(--line-2); border-radius: 0 5px 5px 0; padding: 9px 12px; }
.note.warn { background: var(--amber-soft); border-left-color: var(--amber); color: var(--amber-ink); }
.legend td:first-child { white-space: nowrap; }
.legend tr.gan td { font-weight: 600; color: var(--green-ink); }
.lk { display: inline-block; width: 12px; height: 12px; border-radius: 3px; background: var(--s); margin-right: 8px; vertical-align: -1px; }
.lk.hatch { background: repeating-linear-gradient(45deg, var(--s) 0 2px, transparent 2px 4px); }
.lk.gain { background: var(--green); }

/* ---------- filamentos, impresoras, pedidos, reportes, ajustes ---------- */

/* ---------- diálogo, globo, aviso ---------- */
dialog { border: 1px solid var(--line-2); border-radius: 8px; padding: 0; background: var(--bg); color: var(--ink); width: min(540px, calc(100vw - 32px)); max-height: calc(100% - 32px); box-shadow: 0 24px 70px rgba(25, 12, 60, .35); }

/* ---------- cantidad y precio en venta y pedido ---------- */
.gp { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px 14px; }

.kv > div:first-child { border-top: 0; }

.chk { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 2px 10px; align-items: start; cursor: pointer; }

.chk span { font-weight: 600; }

.kcard p small { font-size: 12.5px; color: var(--ink-3); }
.tip { position: fixed; z-index: 80; pointer-events: none; background: var(--ink); color: var(--bg); padding: 5px 10px; border-radius: 8px; font-size: 12.5px; max-width: 260px; line-height: 1.3; }
.toast { position: fixed; left: 50%; bottom: max(22px, env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 16px); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-weight: 600; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; z-index: 90; max-width: calc(100vw - 32px); text-align: center; }
.toast.on { opacity: 1; transform: translate(-50%, 0); }

/* ---------- piezas, colecciones, armar venta o pedido, pedidos ---------- */
.pcols { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 5px; }

.rowa { display: inline-flex; gap: 6px; }
.itl { list-style: none; margin: 0; padding: 0; display: grid; gap: 3px; }
.itl li { display: flex; gap: 6px; align-items: baseline; flex-wrap: wrap; }

.frow.cparte { grid-template-columns: minmax(0, 1fr) 118px 76px auto; }
.search.wide { display: block; width: 100%; }
.pick { border: 1px solid var(--line-2); border-radius: var(--r); max-height: 262px; overflow-y: auto; margin: 10px 0 18px; padding: 4px; background: var(--bg); }
.pk-g { display: block; font-size: 12.5px; font-weight: 600; color: var(--ink-3); padding: 8px 10px 4px; }
.pk { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 10px; align-items: center; width: 100%; text-align: left; border: 0; background: transparent; padding: 8px 10px; border-radius: 4px; cursor: pointer; }

.ln { display: grid; grid-template-columns: minmax(0, 1fr) 84px 140px 112px; gap: 8px 12px; align-items: start; border: 1px solid var(--line-2); border-left: 3px solid var(--ink); border-radius: 0 var(--r) var(--r) 0; padding: 12px 14px; background: var(--bg); }

.ln-t { font-family: var(--font-display); font-size: 19px; font-weight: 600; line-height: 38px; letter-spacing: -.02em; }
.ln-h { line-height: 1.35; }
.ln-a { display: flex; gap: 4px; justify-content: flex-end; align-items: center; flex-wrap: wrap; margin-left: auto; }
/* de dónde salen las piezas de una línea: existencias o impresión */
.ln-sx { grid-column: 1 / -1; display: grid; grid-template-columns: minmax(0, 1fr) 34px 66px 46px auto auto; column-gap: 12px; align-items: center; border-top: 2px solid var(--ink); margin-top: 4px; }
.sx-hd, .sx-r { display: contents; }

.ln-foot { grid-column: 1 / -1; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 4px 16px; }

.apl { list-style: none; margin: 0 0 6px; padding: 0; display: grid; gap: 6px; }
.apl li { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; padding: 8px 10px; background: var(--bg); border: 1px solid var(--line); border-radius: var(--r); font-size: 14px; }
.apl li .num { margin-left: auto; }
.ex-td small { font-weight: 400; }
.ln-empty { text-align: center; padding: 22px 12px; color: var(--ink-2); border: 1px dashed var(--line-2); border-radius: var(--r); display: grid; justify-items: center; gap: 8px; }
.gdesc .fld { max-width: 150px; }
.b-sum-note { margin: 0; }
.kc-h { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
.kc-h b { font-size: 15px; }
.kc-l { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; font-size: 14px; }
.kc-l li { display: flex; gap: 6px; align-items: baseline; }
.kc-l li > .num { flex: none; white-space: nowrap; }
.kc-l li > .chip { flex: none; }
.kc-nm { font-weight: 500; flex: 1 1 auto; min-width: 0; }
.kc-j { display: grid; gap: 4px; padding: 8px 10px; background: var(--panel); border-left: 3px solid var(--purple); border-radius: 0 4px 4px 0; font-size: 13px; }
.kc-j .prog { height: 6px; }
.kcard dd.neg { color: var(--red-ink); }
.stp { list-style: none; margin: 0 0 26px; padding: 0; display: flex; gap: 4px; }

.stp-b { display: block; height: 10px; border-radius: 2px; background: var(--panel-2); }

.stp li.done .stp-b { background-color: var(--green); }
.stp li.now { color: var(--ink); }
.stp li.now .stp-b { background-color: var(--purple); position: relative; }
.stp li.now .stp-b::after { content: ""; position: absolute; right: -2px; top: -7px; border: 5px solid transparent; border-top: 6px solid var(--ink); border-bottom: 0; }
.pj { border: 1px solid var(--line-2); border-left: 3px solid var(--purple); border-radius: 0 var(--r) var(--r) 0; padding: 10px 12px; display: grid; gap: 6px; margin-bottom: 8px; }
.pj-h { display: flex; justify-content: space-between; align-items: center; gap: 8px; }

.pagos li { display: grid; grid-template-columns: 60px minmax(0, 1fr) auto auto; gap: 10px; align-items: baseline; padding: 8px 0; border-top: 1px solid var(--line); font-size: 14px; }
.jobrow { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 270px); gap: 8px 14px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); }

.plan { list-style: none; margin: 10px 0 0; padding: 0; display: grid; gap: 6px; }
.plan li { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 8px; align-items: start; padding: 8px 10px; background: var(--panel); border-radius: 9px; font-size: 14px; }

.cola li > span { font-size: 13px; white-space: nowrap; }

/* ---------- filamentos: la barra para elegir material, color y marca, y los rollos de cada filamento ---------- */
.lead { max-width: 70ch; color: var(--ink-2); margin: -8px 0 22px; }
.note.ok { background: var(--green-soft); border-left-color: var(--green); color: var(--green-ink); }
.mrow small.inl { display: inline; margin-left: 4px; }
.fbar { border: 1px solid var(--line-2); border-radius: 12px; background: var(--bg); }

.fbar[open] > summary { border-bottom: 1px solid var(--line); border-radius: 12px 12px 0 0; }
.fb-t { display: grid; min-width: 0; flex: 1; line-height: 1.25; }
.fb-t b { font-size: 16px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ---------- capas: el sello de Quick Robot. Lo que se llena parece una pieza impresa, con sus líneas de capa ---------- */
.prog i, .stk i, .hb .hb-t i, .col i, .stp li.done .stp-b, .stp li.now .stp-b, .capas i, .mbar i, .sbar i:not(.hatch), .tcol .stk3 i { background-image: repeating-linear-gradient(0deg, var(--ln, rgba(255, 255, 255, .34)) 0 1px, transparent 1px 3px); }
.prog.noz { overflow: visible; }
.prog.noz i { position: relative; }
.prog.noz i::after { content: ""; position: absolute; right: -5px; top: -7px; border: 5px solid transparent; border-top: 6px solid var(--ink); border-bottom: 0; }
.prog.mini { display: inline-block; width: 54px; height: 6px; vertical-align: middle; }

/* ---------- etiquetas de lugar: dónde está cada pieza ---------- */
:is(.tg, .capas i, .lg i) { --c: var(--ink-3); --cx: #fff; }
:is(.tg, .capas i, .lg i).stock { --c: #067a30; --cx: #fff; }
:is(.tg, .capas i, .lg i).sale, :is(.tg, .capas i, .lg i).ped { --c: #4b4b55; --cx: #fff; }
:is(.tg, .capas i, .lg i).ok { --c: var(--green); --cx: var(--ink); }
:is(.tg, .capas i, .lg i).print { --c: var(--purple); --cx: #fff; }
:is(.tg, .capas i, .lg i).queue { --c: #b9a8ee; --cx: var(--ink); --ln: rgba(18, 18, 20, .1); }
:is(.tg, .capas i, .lg i).todo { --c: #f0b429; --cx: var(--ink); --ln: rgba(18, 18, 20, .12); }
:is(.tg, .capas i, .lg i).warn { --c: var(--red); --cx: #fff; }
:is(.tg, .capas i, .lg i).done { --c: #cfcfd8; --cx: var(--ink); --ln: rgba(18, 18, 20, .08); }
.tg { display: inline-flex; align-items: stretch; font-size: 12.5px; font-weight: 600; line-height: 1.4; background: var(--panel); color: var(--ink); border-radius: 3px; overflow: hidden; white-space: nowrap; padding-right: 8px; }
.tg b { background: var(--c); color: var(--cx); min-width: 22px; padding: 0 6px; text-align: center; margin-right: 7px; font-weight: 600; }
.tg:not(:has(b))::before { content: ""; width: 3px; background: var(--c); margin-right: 7px; }
.tg-set { font-size: 11.5px; font-weight: 600; color: var(--ink-2); border: 1px solid var(--line-2); border-radius: 3px; padding: 0 5px; vertical-align: 1px; }
.capas { display: flex; gap: 2px; height: 14px; width: 100%; min-width: 90px; }
.capas.sm { height: 8px; }
.capas i { display: block; height: 100%; min-width: 3px; background-color: var(--c); border-radius: 1px; }
.lg { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 13.5px; color: var(--ink-2); }
.lg li { display: inline-flex; align-items: center; gap: 6px; }

.lg b { color: var(--ink); }

/* ---------- desglose por pieza (pedido y venta) ---------- */
.dsg-sum { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 22px; margin: 0 0 14px; }
.dsg-sum .capas { flex: 1 1 220px; max-width: 460px; }
.surt { display: grid; gap: 8px; }
.surt .capas { max-width: none; }
.dsg-blk .hint { margin-top: 10px; }
.strip + fieldset.blk { border-top: 0; padding-top: 0; }
.tbl.dsg { min-width: 780px; }
.dsg th, .dsg td { white-space: nowrap; }
.dsg td.pz-n { white-space: normal; min-width: 170px; }
.dsg td.c-ori, .dsg th.c-ori { white-space: normal; min-width: 200px; }

/* ============ suave: objetos en vez de filas ============ */
:root { --r: 14px; --sh-soft: 0 1px 2px rgba(18, 18, 20, .04); --sh-up: 0 10px 28px rgba(18, 18, 20, .10); }
.btn { border-radius: 10px; }
input, select, textarea, .unit { border-radius: 10px; }
dialog { border-radius: 18px; }
.seg, .seg2 { display: inline-flex; flex-wrap: wrap; gap: 2px; padding: 4px; background: var(--panel); border: 0; border-radius: 99px; }
.seg button, .seg2 button { border: 0; margin: 0; border-radius: 99px; padding: 6px 16px; font-weight: 600; color: var(--ink-2); background: transparent; cursor: pointer; }
.seg button:hover, .seg2 button:hover { color: var(--ink); }
.seg button.on, .seg2 button.on { background: var(--bg); color: var(--ink); box-shadow: 0 1px 3px rgba(18, 18, 20, .14); border: 0; }
.seg2 button { padding: 5px 14px; font-size: 13.5px; }
.tag { border: 0; background: var(--panel); border-radius: 99px; padding: 5px 14px; }
.tag:hover { background: var(--panel-2); color: var(--ink); }
.tag.on { background: var(--ink); color: var(--bg); }
.chip { border-left: 0; border-radius: 99px; padding: 2px 10px 2px 8px; }
.chip::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--c); margin-right: 6px; flex: none; }
.detail, .pcard { border: 0; border-radius: 20px; background: var(--bg); box-shadow: 0 0 0 1px var(--line), 0 8px 30px rgba(18, 18, 20, .06); padding: 20px; }
.toolbar .tb-r { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.pill { display: inline-flex; align-items: center; gap: 6px; border-radius: 99px; padding: 3px 11px; font-size: 12.5px; font-weight: 600; background: var(--panel-2); color: var(--ink-2); white-space: nowrap; }
.pill.good { background: var(--green-soft); color: var(--green-ink); }
.pill.warn { background: var(--amber-soft); color: var(--amber-ink); }
.pill.info { background: var(--purple-soft); color: var(--purple); }
.pill.bad { background: var(--red-soft); color: var(--red-ink); }
.empty-card { grid-column: 1 / -1; text-align: center; padding: 40px 20px; background: var(--panel); border-radius: 20px; color: var(--ink-2); display: grid; justify-items: center; gap: 10px; }
.empty-card p { max-width: 46ch; }

/* pieza impresa en capas: el color es el del filamento */
.lay { --w: 62px; --h: 56px; position: relative; z-index: 1; display: inline-block; flex: none; width: calc(var(--w) * var(--z, 1)); height: calc(var(--h) * var(--z, 1)); background: var(--lb, #c9c9d1); box-shadow: inset 0 0 0 1px rgba(32, 26, 54, .16), inset 0 -8px 12px rgba(18, 18, 20, .10); overflow: hidden; }
.lay::after { content: ""; position: absolute; inset: 0; background: repeating-linear-gradient(0deg, rgba(255, 255, 255, .32) 0 1px, rgba(18, 18, 20, .07) 1px 2px, transparent 2px 4px); }
.lay.s0 { --w: 62px; --h: 56px; border-radius: 50% 50% 10px 10px / 62% 62% 10px 10px; }
.lay.s1 { --w: 54px; --h: 66px; border-radius: 14px 14px 8px 8px; }
.lay.s2 { --w: 76px; --h: 46px; border-radius: 26px 26px 8px 8px / 30px 30px 8px 8px; }
.lay.sm { --z: .62; margin-inline: calc((52px - var(--w) * var(--z)) / 2); }
.lay.printing { background: linear-gradient(to top, var(--purple) var(--p), transparent var(--p)); box-shadow: inset 0 0 0 1.5px var(--line-2); }
.lay.empty { background: transparent; box-shadow: inset 0 0 0 1.5px var(--line-2); }
.lay.empty::after { display: none; }
.lay-row { display: flex; align-items: flex-end; gap: 6px; position: relative; z-index: 1; }
.lay-row .lay { --z: .78; }

/* fotos de piezas */
.lay-img { display: inline-block; flex: none; width: 38px; height: 38px; margin-inline: 7px; border-radius: 10px; overflow: hidden; background: var(--panel); box-shadow: inset 0 0 0 1px rgba(32, 26, 54, .14); }
.lay-img img { width: 100%; height: 100%; object-fit: cover; display: block; }
.pt-top.has-img { padding: 0; overflow: hidden; }
.pt-top.has-img::after { display: none; }
.pt-img { width: 100%; height: 100%; object-fit: cover; display: block; }
.foto-row { display: flex; gap: 16px; align-items: center; margin: 4px 0 18px; flex-wrap: wrap; }
.foto-prev { width: 132px; height: 100px; flex: none; border-radius: 16px; background: var(--panel); display: flex; align-items: flex-end; justify-content: center; padding-bottom: 14px; overflow: hidden; }
.foto-prev img { width: 100%; height: 100%; object-fit: cover; margin-bottom: -14px; }
.foto-ctl { display: grid; gap: 6px; min-width: 0; flex: 1 1 220px; }
.foto-ctl small { max-width: 44ch; }

/* fichas de piezas */
.pt-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 18px; }
.pt { background: var(--bg); border-radius: 20px; box-shadow: 0 0 0 1px var(--line), var(--sh-soft); display: flex; flex-direction: column; cursor: pointer; overflow: hidden; transition: box-shadow .18s, transform .18s; min-width: 0; }
.pt:hover, .pt:focus-visible { box-shadow: 0 0 0 1px var(--line-2), var(--sh-up); transform: translateY(-2px); }
.pt-top { position: relative; height: 112px; background: var(--panel); display: flex; align-items: flex-end; justify-content: center; padding-bottom: 15px; margin: 6px; border-radius: 15px; }
.pt-top::after { content: ""; position: absolute; left: 16%; right: 16%; bottom: 10px; height: 5px; border-radius: 5px; background: var(--panel-2); }
.pt-tags { position: absolute; left: 12px; top: 12px; display: flex; gap: 4px; flex-wrap: wrap; z-index: 2; }
.pt-tags .pill { background: var(--bg); }
.pt-b { padding: 8px 18px 18px; display: grid; gap: 6px; }
.pt-n { font-weight: 600; font-size: 16.5px; letter-spacing: -.02em; line-height: 1.2; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pt-s { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pt-pr { display: flex; align-items: baseline; gap: 4px 10px; flex-wrap: wrap; margin-top: 4px; }
.pt-p { font-size: 28px; font-weight: 600; letter-spacing: -.04em; line-height: 1; }
.pt-g { font-size: 13px; font-weight: 600; }
.pt .mbar { width: 100%; height: 8px; border-radius: 99px; }
.pt-f { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; color: var(--ink-2); }
.pt-st { margin-top: 2px; }
.pt { position: relative; }
.pt-a { position: absolute; top: 12px; right: 12px; z-index: 3; display: flex; gap: 6px; }
.pt-a .btn { background: var(--bg); border-color: transparent; box-shadow: 0 1px 3px rgba(18, 18, 20, .16); }
.pt-a .btn.ghost { color: var(--ink); }
@media (hover: hover) { .pt-a { opacity: 0; transition: opacity .15s; } .pt:hover .pt-a, .pt:focus-within .pt-a { opacity: 1; } }

/* existencias: cada unidad es un cubo */
.xlist { display: grid; gap: 10px; min-width: 0; }
.xc { background: var(--bg); border-radius: 16px; box-shadow: 0 0 0 1px var(--line); padding: 14px 16px; display: grid; gap: 10px; cursor: pointer; transition: box-shadow .18s; min-width: 0; }
.xc:hover { box-shadow: 0 0 0 1px var(--line-2), var(--sh-up); }

.xc-h { display: flex; align-items: center; gap: 8px; }
.xc-t { flex: 1; min-width: 0; }
.xc-t b, .xc-t small { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cubes { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
.cube { width: 14px; height: 14px; border-radius: 4px; display: inline-block; background-color: var(--cc, #c9c9d1); background-image: repeating-linear-gradient(0deg, rgba(255, 255, 255, .35) 0 1px, transparent 1px 3px); box-shadow: inset 0 0 0 1px rgba(32, 26, 54, .2); }
.cube.ap { background-color: var(--bg); background-image: repeating-linear-gradient(45deg, var(--purple) 0 1.5px, transparent 1.5px 4px); box-shadow: inset 0 0 0 1.5px var(--purple); }
.cubes.none .cube { background: transparent; box-shadow: none; outline: 1.5px dashed var(--line-2); outline-offset: -1.5px; }

.xc-n { display: flex; gap: 6px 16px; flex-wrap: wrap; font-size: 13.5px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 22px; font-size: 13.5px; color: var(--ink-2); margin: -6px 0 18px; }

/* inicio */

.sc .v small { font-size: 16px; font-weight: 500; color: var(--ink-2); letter-spacing: 0; }

.sc.hero .k { color: var(--green-ink); }
.sc.hero .pill { background: none; padding-left: 0; }
.cols2.soft { gap: 44px; }
.rk { list-style: none; margin: 16px 0 0; padding: 0; display: grid; gap: 14px; }
.rk li { display: flex; gap: 6px; align-items: center; }
.rk-m { flex: 1; min-width: 0; display: grid; gap: 5px; }
.rk-t { display: flex; justify-content: space-between; gap: 10px; }
.rk-t b { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ---------- interfaz neutra: el color solo significa algo ----------
   Grafito para costo y estructura · verde = ganancia y lo positivo · rojo = deuda, fallos · ámbar = aviso.
   La marca vive en el logo, R1, las pantallas vacías y el color real de cada filamento. */
:root { --c-m: #2d2d35; --c-l: #5a5a65; --c-q: #8b8b97; --c-t: #b9b9c3; --c-e: #dcdce3; --c-f: #9a9aa6; --purple-soft: #eeeef2; }

.av, .ins-ic { background: var(--panel-2); color: var(--ink-2); }
.banner { background: var(--panel-2); color: var(--ink); }
.pill.info, .chip.info, .tg-set { background: var(--panel-2); color: var(--ink-2); }
.fb-c, .exp small { color: var(--ink-2); }
.status.info { --c: var(--ink-3); }
.prog i, .prog.soft i { background-color: var(--c-l); }
.stp li.now .stp-b { background-color: var(--ink); }
.kcol.k-prod { --c: var(--ink-2); }
.lay.printing { background: linear-gradient(to top, var(--c-l) var(--p), transparent var(--p)); }
.calc, .pj, .job.bay, .kc-j { border-left-color: var(--line-2); }
.tbl tr.sel td { background: var(--panel); }
.tbl tr.click:hover td:first-child, .tbl tr.sel td:first-child { box-shadow: none; }
.xc.sel { box-shadow: 0 0 0 2px var(--ink), 0 8px 22px rgba(18, 18, 20, .10); }
.cube.ap { background-image: repeating-linear-gradient(45deg, var(--c-q) 0 1.5px, transparent 1.5px 4px); box-shadow: inset 0 0 0 1.5px var(--c-q); }
.ref:hover, .pk:hover, .pk:focus-visible { background: var(--panel); border-color: var(--line-2); }

<script>
(() => {
"use strict";
/* ============ Quick Robot · maqueta del sistema del taller ============ */

const f2 = new Intl.NumberFormat('es-MX', { style: 'currency', currency: 'MXN', minimumFractionDigits: 2, maximumFractionDigits: 2 });

const mx = n => f2.format(n || 0);

const fmtNum = x => String(Math.round((x || 0) * 100) / 100);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const clone = o => JSON.parse(JSON.stringify(o));
let uid = 0;
const nid = p => p + Date.now().toString(36) + (++uid);
const byId = (arr, id) => (arr || []).find(x => x.id === id);
const round2 = x => Math.round((x + Number.EPSILON) * 100) / 100;

/* ---------- fechas ---------- */
const HOY = new Date(); HOY.setHours(12, 0, 0, 0);
const iso = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
const dd = n => { const d = new Date(HOY); d.setDate(d.getDate() + n); return iso(d); };
const fDate = s => new Date(s + 'T12:00:00').toLocaleDateString('es-MX', { day: 'numeric', month: 'short' }).replace('.', '');
const daysTo = s => Math.round((new Date(s + 'T12:00:00') - HOY) / 864e5);
const entregaTxt = s => { const n = daysTo(s); return n < 0 ? 'hace ' + (-n) + ' d' : n === 0 ? 'hoy' : n === 1 ? 'mañana' : 'en ' + n + ' días'; };

/* ---------- iconos ---------- */
const IC = {
  home: '<path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v9.5h13V10"/>',
  box: '<path d="M21 8 12 3 3 8v8l9 5 9-5z"/><path d="M3 8l9 5 9-5M12 13v8"/>',

  coin: '<circle cx="12" cy="12" r="9"/><path d="M12 6.5v11M9.2 9.3c0-1.1 1.2-1.7 2.8-1.7s2.8.7 2.8 1.9-1.2 1.6-2.8 2-2.8.8-2.8 2 1.2 1.9 2.8 1.9 2.8-.7 2.8-1.7"/>',
  list: '<rect x="5.5" y="4" width="13" height="17" rx="2"/><path d="M9 4V3h6v1M9 10h6M9 14h6M9 18h3"/>',
  spool: '<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3"/><path d="M12 3c-2 3-2 6 0 9M12 21c2-3 2-6 0-9"/>',

const norm = s => String(s == null ? '' : s).normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/\s+/g, ' ').trim();
const filKey = (m, c) => norm(m) + '|' + norm(c);
const nomCat = x => typeof x === 'string' ? x : x.n;
const buscaCat = (lista, v) => { const k = norm(v); return k ? (lista || []).find(x => norm(nomCat(x)) === k) : undefined; };
/* agrega a la lista si no está (sin importar mayúsculas o acentos) y regresa el nombre oficial */
function catAdd(tipo, v, hex, cat) {
  cat = cat || S.cat; v = String(v == null ? '' : v).trim().replace(/\s+/g, ' ');
  if (!v) return '';
  const ex = buscaCat(cat[tipo], v); if (ex) return nomCat(ex);
  if (tipo === 'colores') { v = v.charAt(0).toUpperCase() + v.slice(1); cat.colores.push({ n: v, hex: hex || '#9a9aa6' }); } else cat[tipo].push(v);

}

const rName = r => filN(r.fil);

function costoGF(fid, s = S) {

/* ---------- gastos del negocio ----------

/* ---------- impresoras: mantenimiento e inversión ---------- */
const MANT_BASE = [['Cambiar la boquilla', 300], ['Lubricar ejes', 200], ['Limpiar la cama', 100]];

/* ---------- colecciones: un conjunto de piezas que ya existen ---------- */

/* ---------- material, tiempo y existencias ---------- */

/* ---------- un artículo de una venta o un pedido ----------

const itemsTxt = (its, max = 3) => its.slice(0, max).map(itemTxt).join(' + ') + (its.length > max ? ' + ' + (its.length - max) + ' más' : '');

/* ---------- ventas ---------- */

/* ---------- pedidos ---------- */

const ESTADOS = { cotizado: ['Cotizado', ''], aceptado: ['Aceptado', 'info'], produccion: ['En producción', 'warn'], listo: ['Listo', 'good'], entregado: ['Entregado', ''], cancelado: ['Cancelado', 'bad'] };

/* ---------- existencias: las piezas terminadas ----------

function apartadas(pid, exc, s = S) {
  return s.pedidos.reduce((a, p) => {
    if (p.id === exc) return a;
    if (p.estado === 'aceptado' || p.estado === 'produccion') return a + pedUsoDe(p, pid);
    if (p.estado === 'listo') return a + ((p.stk && p.stk[pid]) || 0);
    return a;
  }, 0);
}
const libres = (pid, exc, s = S) => Math.max(0, fisicas(pid, s) - apartadas(pid, exc, s));
/* cuántos sets completos puedes armar hoy con lo que tienes libre */
function armables(c, exc, s = S) {
  const need = {}; (c.partes || []).forEach(r => { if (r.prod) need[r.prod] = (need[r.prod] || 0) + cantParte(r); });
  const ids = Object.keys(need); if (!ids.length) return 0;
  return Math.min(...ids.map(id => llevaStock(byId(s.productos, id)) ? Math.floor(libres(id, exc, s) / need[id]) : 0));
}
function addPm(prod, tipo, n, nota, ref, fecha) {
  if (!n || !llevaStock(byId(S.productos, prod))) return false;
  S.pmovs.push({ id: nid('pm'), prod, fecha: fecha || dd(0), tipo, n, nota: nota || '', ref: ref || '' });
  return true;
}
const prodsConStock = (s = S) => s.productos.filter(llevaStock);
const stockTot = (s = S) => prodsConStock(s).reduce((a, p) => { const f = fisicas(p.id, s), ap = Math.min(f, apartadas(p.id, null, s)); a.libres += f - ap; a.apartadas += ap; return a; }, { libres: 0, apartadas: 0 });
/* al aceptar un pedido se apartan las piezas que se habían planeado sacar de existencias; si ya no alcanzan, el resto se imprime. Regresa cuántas faltaron. */
function apartarPedido(p) {
  const rem = {}; let menos = 0;
  pedItems(p).forEach(it => {
    if (!it.uso) return;
    Object.keys(it.uso).forEach(pid => {
      if (!(pid in rem)) rem[pid] = llevaStock(byId(S.productos, pid)) ? libres(pid, p.id) : 0;
      const u = Math.min(it.uso[pid], rem[pid]); menos += it.uso[pid] - u; it.uso[pid] = u; rem[pid] -= u;
      if (u <= 0) delete it.uso[pid];
    });
    if (!Object.keys(it.uso).length) delete it.uso;
  });
  return menos;
}

/* ---------- impresoras: lo que imprimen ahora y lo que espera ---------- */
function jobInfo(e) {
  if (!e.inicio) return { pct: 0, resta: e.min, activo: false };
  const t = (Date.now() - e.inicio) / 60000;
  return { pct: Math.round(Math.max(0, Math.min(99, t / Math.max(1, e.min) * 100))), resta: Math.max(0, Math.round(e.min - t)), activo: true };
}
const colaMin = i => (i.cola || []).reduce((a, e, k) => a + (k === 0 ? jobInfo(e).resta : e.min), 0);
const impEstado = i => (i.cola && i.cola.length) ? 'imprimiendo' : 'libre';
function quitarDeCola(i, pedId) {
  i.cola = (i.cola || []).filter(e => e.pedido !== pedId);
  if (i.cola[0] && !i.cola[0].inicio) i.cola[0].inicio = Date.now();   // el que sigue empieza
}
/* asign: {posición del artículo: id de impresora}. Una entrada en la cola por impresora. */
function asignarCola(p, asign) {
  const grupos = {};
  p.items.forEach((it, k) => { const id = asign[k]; if (!id) return; it.imp = id; (grupos[id] = grupos[id] || []).push(it); });
  Object.keys(grupos).forEach(id => {
    const i = byId(S.impresoras, id); if (!i) return;
    const its = grupos[id], min = Math.max(1, Math.round(its.reduce((a, it) => a + itemHoras(it), 0) * 60));
    i.cola = i.cola || [];
    i.cola.push({ id: nid('q'), pedido: p.id, texto: itemsTxtImpr(its), min, inicio: i.cola.length ? null : Date.now() });
  });
}
/* en qué impresoras está un pedido y cuánto falta para que le toque */
function pedJobs(p) {
  const out = [];
  S.impresoras.forEach(i => (i.cola || []).forEach((e, pos) => {
    if (e.pedido !== p.id) return;
    const espera = pos === 0 ? 0 : jobInfo(i.cola[0]).resta + i.cola.slice(1, pos).reduce((a, x) => a + x.min, 0);
    out.push({ i, e, pos, info: jobInfo(e), espera });
  }));
  return out;
}
/* al terminar: libera las impresoras y, si el filamento ya se descontó, anota las impresiones en Producción */
function registrarProduccion(p) {
  pedItems(p).forEach(it => { const im = itemImpr(it); Object.keys(im).forEach(id => {
    const pr = byId(S.productos, id); if (!pr) return;
    const h = horasTotal(pr, im[id]), imp = byId(S.impresoras, it.imp);
    const rg = { id: nid('im'), fecha: dd(0), prod: pr.id, cant: im[id], imp: it.imp || '', res: 'bien', horas: h, motivo: 'pedido', texto: '', filamentos: (pr.filamentos || []).filter(f => f.fil && num(f.g) > 0).map(f => ({ fil: f.fil, g: num(f.g) * im[id] })), pedido: p.id };
    S.imps.push(rg); usarInsumos(rg);
    if (imp) imp.horas += h;
  }); });
  p.logueado = true;
}
/* al quedar listo, las piezas que se imprimieron para el pedido pasan por Existencias y quedan apartadas junto con las que ya estaban */
function marcarListo(p) {
  S.impresoras.forEach(i => quitarDeCola(i, p.id));
  p.estado = 'listo'; p.listo = dd(0);
  if (p.descontado && !p.logueado) registrarProduccion(p);
  const need = {}; pedItems(p).forEach(it => sumMat(need, itemNeed(it)));
  p.stk = {};
  Object.keys(need).forEach(id => {
    if (!llevaStock(byId(S.productos, id))) return;
    p.stk[id] = need[id];
    addPm(id, 'pedido', need[id] - Math.min(need[id], pedUsoDe(p, id)), 'Pedido #' + p.folio, p.id);
  });
}
function entregarPedido(p, cobro) {
  if (cobro > 0) p.pagos.push({ id: nid('pg'), fecha: dd(0), monto: round2(cobro), nota: 'Al entregar' });
  p.estado = 'entregado'; p.entregado = dd(0);
  S.ventas.push({ id: nid('v'), fecha: dd(0), canal: p.canal, nota: 'Pedido #' + p.folio, cliente: p.cliente, pedido: p.id, items: p.items.map(it => { const o = clone(it); delete o.imp; delete o.uso; return o; }) });
  Object.keys(p.stk || {}).forEach(id => addPm(id, 'entrega', -p.stk[id], 'Pedido #' + p.folio, p.id));
}

/* ---------- desglose por pieza ----------
   Un artículo se abre en las piezas que lo forman (una colección trae varias). Cada pieza dice cuántas son, a qué precio, cuánto costó
   y dónde está: en Existencias, por imprimir, imprimiendo, en cola, lista o entregada. Es la misma cuenta para pedidos y ventas.
   El precio de un set se reparte entre sus piezas según su precio de lista (igual que en los reportes). */
const ORI = { stock: 'Existencias', todo: 'Por imprimir', print: 'Imprimiendo', queue: 'En cola', ok: 'Lista', done: 'Entregada', warn: 'Sin impresora', sale: 'Existencias', ped: 'Pedido' };
const ORI_ORDEN = ['stock', 'sale', 'ped', 'ok', 'print', 'queue', 'todo', 'warn', 'done'];
function itemDesglose(it, ctx = {}) {
  const p = ctx.p, est = p ? p.estado : '', pool = Object.assign({}, it.uso || {}), cm = ctx.cm || 0;
  const rows = lineasItem(it).map(l => {
    const ex = p ? Math.min(l.cant, Math.max(0, pool[l.prod] || 0)) : l.cant;
    if (p) pool[l.prod] = Math.max(0, (pool[l.prod] || 0) - ex);
    const imp = l.cant - ex, tags = [];
    if (!p) tags.push({ k: ctx.v && ctx.v.pedido ? 'ped' : 'sale', n: l.cant });
    else if (est === 'entregado') tags.push({ k: 'done', n: l.cant });
    else if (est === 'listo') tags.push({ k: 'ok', n: l.cant, s: 'apartada en existencias' });
    else {
      if (ex) tags.push({ k: 'stock', n: ex, s: est === 'cotizado' ? 'se aparta al aceptar' : 'apartada' });
      if (imp) {
        const j = est === 'produccion' ? (ctx.jobs || []).find(x => x.i.id === it.imp) : null, im = byId(S.impresoras, it.imp);
        if (est !== 'produccion') tags.push({ k: 'todo', n: imp });
        else if (j && j.pos === 0) tags.push({ k: 'print', n: imp, s: j.i.nombre + ' · ' + j.info.pct + '%', pct: j.info.pct });
        else if (j) tags.push({ k: 'queue', n: imp, s: j.i.nombre + ' · le toca en ~' + durMin(j.espera) });
        else if (it.imp) tags.push({ k: 'ok', n: imp, s: 'impresa' + (im ? ' en ' + im.nombre : '') });
        else tags.push({ k: 'warn', n: imp, s: 'falta asignar' });
      }
    }
    return { pid: l.prod, nombre: l.nombre, cant: l.cant, unit: l.cant ? l.ingreso / l.cant : 0, total: l.ingreso, costo: l.costo, gan: l.ingreso * (1 - cm) - l.costo, ex, imp, tags };
  });
  const total = itemTot(it), costo = itemCosto(it);
  return { it, set: it.k === 'c', nombre: it.nombre, cant: it.cant, precio: it.precio, lista: it.lista, total, costo, gan: total * (1 - cm) - costo, rows, tags: rows.reduce((a, r) => { r.tags.forEach(t => { a[t.k] = (a[t.k] || 0) + t.n; }); return a; }, {}) };
}
const sumTags = gs => gs.reduce((a, g) => { Object.keys(g.tags).forEach(k => { a[k] = (a[k] || 0) + g.tags[k]; }); return a; }, {});
function pedDesglose(p) {
  const jobs = p.estado === 'produccion' ? pedJobs(p) : [], cm = comisionCanal(p.canal) / 100;
  const grupos = pedItems(p).map(it => itemDesglose(it, { p, jobs, cm }));
  return { grupos, cuenta: sumTags(grupos), piezas: pedPiezas(p) };
}
function ventaDesglose(v) {
  const cm = comisionCanal(v.canal) / 100, grupos = ventaItems(v).map(it => itemDesglose(it, { v, cm }));
  return { grupos, cuenta: sumTags(grupos), piezas: ventaPiezas(v) };
}
/* dónde está cada pieza, agrupado por lugar: [{k, n, pz:{nombre: cuántas}}] en el orden de ORI_ORDEN */
function origenesDe(D) {
  const o = {};
  D.grupos.forEach(g => g.rows.forEach(r => r.tags.forEach(t => { const x = o[t.k] || (o[t.k] = { k: t.k, n: 0, pz: {} }); x.n += t.n; x.pz[r.nombre] = (x.pz[r.nombre] || 0) + t.n; })));
  return ORI_ORDEN.filter(k => o[k]).map(k => o[k]);
}

/* ============ Editor de una pieza ============ */
let draft = null;
function newDraft() {
  return { id: nid('pr'), nombre: '', imp: S.impresoras[0] ? S.impresoras[0].id : '', horas: 0, prep: 5, acab: 0, lote: 1, extras: 0, insumos: [], ficha: null, filamentos: [{ fil: '', g: 0 }], precio: 0, modo: 'valor', tags: [], nota: '', padre: null, stock: false };
}
function openEditor(d) { draft = d; go('editor'); }
/* al agregar un rollo desde el editor, el filamento nuevo queda elegido en la primera línea sin filamento */
function pickEd(fid) { if (!draft) return; const i = draft.filamentos.findIndex(f => !f.fil); if (i >= 0) draft.filamentos[i].fil = fid; else if (!draft.filamentos.some(f => f.fil === fid)) draft.filamentos.push({ fil: fid, g: 0 }); }

function filRow(f, i) {
  const x = byId(S.filamentos, f.fil), rest = x ? restanteF(x.id) : 0, g = num(f.g), nr = x ? rollosDe(x.id).filter(r => restante(r) > .5).length : 0;
  return `<div class="frow" data-i="${i}">
    <span class="sw lg" style="--c:${esc(x ? x.hex : '#ccc')}"></span>
    <label class="fld"><span class="sr">Filamento</span><select data-f="fil-sel" data-i="${i}">${x ? '' : '<option value="">Elige un filamento…</option>'}${filsOrd().map(y => `<option value="${y.id}"${y.id === f.fil ? ' selected' : ''}>${esc(fName(y))}</option>`).join('')}</select></label>
    <label class="fld"><span class="sr">Gramos</span>${unit(`<input data-f="fil-g" data-i="${i}" inputmode="decimal" value="${f.g || ''}" placeholder="0">`, 'g')}</label>
    <span class="fcost num">${mx(g * (x ? costoGF(x.id) : 0))}</span>
    <button type="button" class="btn ghost icon" data-act="fil-del" data-i="${i}" aria-label="Quitar filamento"${draft.filamentos.length < 2 ? ' disabled' : ''}>${ico('x', 16)}</button>
    <small class="stock${x && g > rest ? ' bad' : ''}">${x ? (g > rest ? `Disponible: ${gfmt(rest)} (insuficiente)` : `Disponible: ${gfmt(rest)} en ${nr} ${nr === 1 ? 'rollo' : 'rollos'} · ${mx(costoGF(x.id))} por gramo`) : ''}</small></div>`;
}
function filRows() { return (draft.filamentos || []).map(filRow).join(''); }
function vEditor() {
  if (!draft) draft = newDraft();
  if (!(draft.filamentos || []).length) draft.filamentos = [{ fil: '', g: 0 }];
  const d = draft, padre = d.padre && byId(S.productos, d.padre);
  const h = Math.floor(num(d.horas) + 1e-9), m = Math.round((num(d.horas) - h) * 60);
  const crumbs = `<nav class="crumbs"><a href="#productos" data-act="go" data-r="productos">Productos</a><span>/</span><span>${d._orig ? 'Editar pieza' : 'Nueva pieza'}</span></nav>`;
  const banner = padre && !d._orig ? `<p class="banner">Variante de <b>${esc(padre.nombre)}</b>. Cambia el filamento o el color y guarda; el precio se conserva salvo que se modifique.</p>` : '';
  return `${crumbs}${banner}
  <div class="ed">

          ${fld('Otros extras', unit(`<input data-f="extras" inputmode="decimal" value="${d.extras || ''}" placeholder="0">`, '$'), 'Gasto fijo por pieza que no es un insumo')}

        <div class="row2"><button type="button" class="btn block" data-act="cotizar">Cotizar a cliente</button>${d._orig ? `<button type="button" class="btn block" data-act="venta-new" data-k="p" data-id="${d._orig}">Registrar venta</button>` : ''}</div>

      </div>

}

function resHTML(d) {
  const k = costo(d), pr = precioDe(d), tot = k.total, gan = pr - tot, c = S.config;
  const segs = [['Material', k.M, '--c-m'], ['Luz', k.L, '--c-l'], ['Máquina', k.Q, '--c-q'], ['Extras', k.E, '--c-e'], ['Fallos (reserva)', k.F, '--c-f', 'hatch']];
  const scale = Math.max(pr, tot, 1), loss = pr < tot;
  const bar = segs.filter(s => s[1] > 0).map(s => `<i class="${s[3] || ''}" style="width:${s[1] / scale * 100}%;--s:var(${s[2]})" data-tip="${s[0]}: ${mx(s[1])}" tabindex="0"></i>`).join('')
    + (gan > 0 ? `<i class="gain" style="width:${gan / scale * 100}%" data-tip="Ganancia: ${mx(gan)}" tabindex="0"></i>` : '');
  const legend = segs.map(s => `<tr><td><span class="lk ${s[3] || ''}" style="--s:var(${s[2]})"></span>${s[0]}</td><td class="r num">${mx(s[1])}</td><td class="r num mut">${pr > 0 ? pct(s[1] / pr * 100) : ''}</td></tr>`).join('');
  const status = pr <= 0 ? ['info', 'Falta el precio para calcular la ganancia.']
    : loss ? ['bad', `Con este precio hay una pérdida de ${mx(tot - pr)} por pieza.`]
    : pr < piso(tot) ? ['warn', `Precio debajo del piso de margen (${mx0(piso(tot))}). Si una impresión falla, la ganancia es casi nula.`]
    : ['good', `Ganancia de ${mx0(gan)} por pieza (${nf1.format(pr / tot)} veces el costo).`];
  const padre = d.padre && byId(S.productos, d.padre);
  let variante = '';
  if (padre && d.modo === 'valor') {
    const dc = tot - costo(padre).total, pp = precioDe(padre);
    variante = `<p class="note">Contra <b>${esc(padre.nombre)}</b>: el costo ${Math.abs(dc) < .005 ? 'es igual' : (dc > 0 ? 'sube ' : 'baja ') + mx(Math.abs(dc))}. ${pr === pp ? 'El precio es el mismo' : 'El precio cambia a ' + mx0(pr)}; la ganancia por pieza es ${Math.abs(dc) < .005 ? 'igual' : mx(Math.abs(dc)) + (dc > 0 ? ' menor' : ' mayor')}.</p>`;
  }
  const tecnico = esTecnico(d) && d.modo === 'valor' ? `<p class="note warn">Material técnico: normalmente conviene fijar el precio con costo + margen. <button type="button" class="link" data-act="modo" data-v="formula">Usar costo + margen</button></p>` : '';
  const enCols = d._orig ? enColecciones(d._orig) : [];
  const colNote = enCols.length ? `<p class="note">Esta pieza está en ${enCols.length === 1 ? 'la colección' : 'las colecciones'} ${enCols.map(c => `<button type="button" class="link" data-act="open-col" data-id="${c.id}">${esc(c.nombre)}</button>`).join(', ')}. Si cambias su precio, el set “igual que las sueltas” se ajusta solo.</p>` : '';
  const mg = Math.min(95, margenDe(d));
  const refs = [['Piso', Math.ceil(piso(tot)), `costo + ${c.margenMin}%`], ['Fórmula', Math.ceil(sugerido(tot, mg)), `margen ${mg}%`], ['×3', nice(tot * 3), ''], ['×5', nice(tot * 5), ''], ['×10', nice(tot * 10), '']];
  const grTot = (d.filamentos || []).reduce((a, f) => a + num(f.g), 0);
  const capP = Math.max(1, Math.round(num(d.lote, 1)) || 1), cu = costo(d).total;
  const qty = `<h3>Por cantidad</h3><div class="tw"><table class="tbl sm"><thead><tr><th>Piezas</th><th class="r">Placas</th><th class="r">Impresión</th><th class="r">Filamento</th><th class="r">Costo</th></tr></thead><tbody>${[1, 2, 5, 10, 25, 50].map(n => `<tr><td>${n}</td><td class="r num">${Math.ceil(n / capP)}</td><td class="r num nw">${hm(horasTotal(d, n))}</td><td class="r num">${gfmt(grTot * n)}</td><td class="r num">${mx(cu * n)}</td></tr>`).join('')}</tbody></table></div><p class="hint">El costo por pieza es el mismo sin importar cuántas se pidan (${mx(cu)}). La cantidad solo cambia las placas y las horas de impresión. El precio de lista no cambia solo: en la venta o el pedido se fija el que se necesite.</p>`;
  const nombreImp = id => id === '*' ? 'Promedio de mis impresoras' : (byId(S.impresoras, id) || {}).nombre;
  const otras = S.impresoras.length < 2 ? '' : `<h3>Costo en otra impresora</h3><div class="tw"><table class="tbl sm"><tbody>${[...(d.imp === '*' ? ['*'] : []), ...S.impresoras.map(i => i.id)].map(id => { const t = costo({ ...d, imp: id }).total, ref = d.imp === id; return `<tr><td>${esc(nombreImp(id))}${ref ? ' <small>(referencia)</small>' : ''}</td><td class="r num">${mx(t)}</td><td class="r num mut">${ref ? '' : (t >= tot ? '+' : '−') + mx(Math.abs(t - tot))}</td></tr>`; }).join('')}</tbody></table></div><p class="hint">La impresora de la pieza es solo una referencia de costo. Al poner un pedido en producción se elige cualquier impresora.</p>`;
  return `
    <div class="sbar${loss ? ' loss' : ''}" role="img" aria-label="Reparto del precio">${bar}</div>
    <div class="kpis"><div><span class="k">Ganancia</span><b class="num ${gan >= 0 ? 'pos' : 'neg'}">${pr > 0 ? mx0(gan) : '—'}</b></div><div><span class="k">Margen</span><b class="num">${pr > 0 ? pct(gan / pr * 100) : '—'}</b></div><div><span class="k">Veces el costo</span><b class="num">${pr > 0 && tot > 0 ? '×' + nf1.format(pr / tot) : '—'}</b></div></div>
    <p class="status ${status[0]}">${ico(status[0] === 'good' ? 'check' : 'warn', 16)}<span>${status[1]}</span></p>
    ${variante}${tecnico}${colNote}
    <table class="tbl sm legend"><tbody>${legend}<tr class="tot"><td>Costo total</td><td class="r num">${mx(tot)}</td><td></td></tr>${pr > 0 ? `<tr class="gan"><td><span class="lk gain"></span>Ganancia</td><td class="r num">${mx(gan)}</td><td class="r num mut">${pct(gan / pr * 100)}</td></tr>` : ''}</tbody></table>
    ${d.modo === 'valor' ? `<div class="refs"><span class="k">Atajos para llenar el precio</span><div>${refs.map(r => `<button type="button" class="ref" data-act="set-precio" data-v="${r[1]}"><b>${mx0(r[1])}</b><small>${r[0]}${r[2] ? ' · ' + r[2] : ''}</small></button>`).join('')}</div></div><p class="hint">Atajos de precio. El precio se puede escribir libremente arriba.</p>` : `<p class="note">Precio por fórmula: costo ÷ (1 − ${mg}%), redondeado hacia arriba. Si prefieres otro, cambia a “Yo pongo el precio”.</p>`}
    ${qty}${otras}`;
}
function refreshRes() {
  if (!draft || CUR !== 'editor') return;
  const d = draft, k = costo(d), pr = precioDe(d);
  $('#r-costo').textContent = mx(k.total);
  const mini = $('#ed-mini'); if (mini) mini.innerHTML = `<span>Costo<b>${mx(k.total)}</b></span><span>Precio de lista<b>${mx0(pr)}</b></span><span>Ganancia<b class="${pr - k.total >= 0 ? 'pos' : 'neg'}">${pr > 0 ? mx0(pr - k.total) : '—'}</b></span>`;
  const inp = $('#f-precio');
  if (inp && (d.modo === 'formula' || document.activeElement !== inp)) inp.value = pr ? (d.modo === 'formula' ? pr : d.precio) : '';
  $('#r-dyn').innerHTML = resHTML(d);
}
function updateFilRow(i) {
  const row = $(`.frow[data-i="${i}"]`); if (!row) return;
  const tmp = document.createElement('div'); tmp.innerHTML = filRow(draft.filamentos[i], i);
  const nr = tmp.firstElementChild;
  row.querySelector('.sw').style.cssText = nr.querySelector('.sw').style.cssText;
  row.querySelector('.fcost').textContent = nr.querySelector('.fcost').textContent;
  const st = row.querySelector('.stock'); st.className = nr.querySelector('.stock').className; st.textContent = nr.querySelector('.stock').textContent;
}
function insRows() {
  const d = draft;
  if (!S.insumos.length) return `<p class="hint">Aún no hay insumos. Créalos en <a href="#insumos" data-act="go" data-r="insumos">Insumos</a> y luego agrégalos a la pieza.</p>`;
  return (d.insumos || []).map((r, i) => { const x = byId(S.insumos, r.ins); return `<div class="irow" data-i="${i}"><select data-f="ins-sel" data-i="${i}" aria-label="Insumo"><option value="">Elegir insumo</option>${S.insumos.map(o => `<option value="${o.id}"${o.id === r.ins ? ' selected' : ''}>${esc(o.nombre)}</option>`).join('')}</select>${unit(`<input data-f="ins-n" data-i="${i}" inputmode="decimal" value="${r.cant || ''}" placeholder="1" aria-label="Cantidad por pieza">`, x ? esc(x.unidad || 'pza') : 'pza')}<b class="num icost">${x ? mx(num(r.cant) * num(x.costo)) : ''}</b><button type="button" class="btn ghost icon" data-act="ins-del" data-i="${i}" aria-label="Quitar insumo">${ico('x', 16)}</button></div>`; }).join('') || '<p class="hint">Esta pieza no lleva insumos.</p>';
}
function onField(el) {
  const f = el.dataset.f, d = draft, v = el.value; if (!d) return;
  if (f && f.startsWith('fi-')) { (d.ficha = d.ficha || {})[f.slice(3)] = v; return; }
  switch (f) {
    case 'nombre': d.nombre = v; return;
    case 'stock':
      if (!el.checked && d._orig && fisicas(d._orig) > 0) { el.checked = true; toast(`Hay ${fisicas(d._orig)} en existencias: ajústalas a 0 en Existencias antes de desactivarlo.`); return; }
      d.stock = el.checked; return;
    case 'nota': d.nota = v; return;
    case 'imp': d.imp = v; break;
    case 'h': case 'min': d.horas = num($('[data-f=h]').value) + num($('[data-f=min]').value) / 60; break;
    case 'prep': d.prep = num(v); break;
    case 'acab': d.acab = num(v); break;
    case 'lote': d.lote = Math.max(1, Math.round(num(v, 1))); break;
    case 'extras': d.extras = num(v); break;
    case 'ins-sel': { const r = d.insumos[+el.dataset.i]; r.ins = v; if (v && !num(r.cant)) r.cant = 1; $('#ins-rows').innerHTML = insRows(); break; }
    case 'ins-n': { const r = d.insumos[+el.dataset.i], x = byId(S.insumos, r.ins); r.cant = num(v); const row = $(`.irow[data-i="${el.dataset.i}"] .icost`); if (row) row.textContent = x ? mx(num(r.cant) * num(x.costo)) : ''; break; }
    case 'precio': d.precio = num(v); break;
    case 'margen': d.margen = Math.min(95, Math.max(0, num(v))); break;
    case 'fil-sel': d.filamentos[+el.dataset.i].fil = v; updateFilRow(+el.dataset.i); break;
    case 'fil-g': d.filamentos[+el.dataset.i].g = num(v); updateFilRow(+el.dataset.i); break;
  }
  refreshRes();
}
function cleanDraft(d) { const o = clone(d); Object.keys(o).forEach(k => k[0] === '_' && delete o[k]); o.filamentos = (o.filamentos || []).filter(f => f.fil); o.insumos = (o.insumos || []).filter(r => r.ins && num(r.cant) > 0); if (!tieneFicha(o)) o.ficha = null; return o; }
function validDraft() {
  const d = draft;
  if (!d.nombre.trim()) { toast('Ponle un nombre a la pieza.'); const n = $('#f-nombre'); if (n) n.focus(); return false; }
  if (!d.filamentos.some(f => f.fil && num(f.g) > 0)) { toast(d.filamentos.some(f => num(f.g) > 0) ? 'Falta elegir el filamento de la pieza.' : 'Faltan los gramos de al menos un filamento.'); return false; }
  if (d.modo === 'valor' && precioDe(d) <= 0) { toast('Escribe el precio de venta.'); const n = $('#f-precio'); if (n) n.focus(); return false; }
  return true;
}
function cotizarDlg() {
  const d = draft, pr = precioDe(d);
  openDlg('Cotizar a cliente', `<div class="grid2">${fld('Cantidad', '<input name="n" inputmode="numeric" value="1">')}${fld('Precio por pieza', unit(`<input name="p" inputmode="decimal" value="${pr || ''}">`, '$'))}${fld('Entrega en', unit('<input name="e" inputmode="numeric" value="5">', 'días'))}${fld('Atiende', '<input name="q" value="Quick Robot">')}</div>
    <label class="fld"><span>Mensaje para WhatsApp</span><textarea id="cot-txt" rows="8" readonly></textarea><small>No incluye costo ni margen: solo lo que ve el cliente.</small></label>`, {
    submit: 'Copiar mensaje', onInput: f => {
      const n = Math.max(1, Math.round(num(f.n.value, 1))), p = num(f.p.value), e = num(f.e.value, 5);
      $('#cot-txt').value = `Hola, te comparto la cotización:\n\n${d.nombre || 'Pieza'} × ${n}\nPrecio por pieza: ${mx0(p)}\nTotal: ${mx0(n * p)}\nTiempo de entrega: ${e} días después del anticipo.\n\nSe imprime en 3D con ${d.filamentos.map(x => { const y = byId(S.filamentos, x.fil); return y ? y.color.toLowerCase() : ''; }).filter(Boolean).join(' y ')}.\nCualquier duda me dices.\n— ${f.q.value}`;

/* ============ Editor de una colección ============
   Una colección no tiene material ni tiempo propios: es un conjunto de piezas que ya existen. */
let cdraft = null;
const newCol = () => ({ id: nid('c'), nombre: '', partes: [{ prod: '', cant: 1 }], extras: 0, precio: 0, tags: [], nota: '' });
function openCol(c) { cdraft = c; go('coleccion'); }
function colParteRow(r, i) {
  const p = r.prod && byId(S.productos, r.prod), cant = cantParte(r);
  return `<div class="frow cparte" data-i="${i}">
    <label class="fld"><span class="sr">Pieza</span><select data-c="parte" data-i="${i}"><option value="">Elige una pieza…</option>${S.productos.map(x => `<option value="${x.id}"${x.id === r.prod ? ' selected' : ''}>${esc(x.nombre)}</option>`).join('')}</select></label>
    <label class="fld"><span class="sr">Cantidad en el set</span>${unit(`<input data-c="cant" data-i="${i}" inputmode="numeric" value="${cant}" aria-label="Cantidad en el set">`, '×')}</label>
    <span class="fcost num">${p ? mx0(precioDe(p) * cant) : ''}</span>
    <button type="button" class="btn ghost icon" data-act="cparte-del" data-i="${i}" aria-label="Quitar pieza"${cdraft.partes.length < 2 ? ' disabled' : ''}>${ico('x', 16)}</button></div>`;
}
const colParteRows = () => cdraft.partes.map(colParteRow).join('');
function vColeccion() {

function colRes(d) {
  const k = costoCol(d, 1), pr = precioCol(d), su = sueltas(d), gan = pr - k.total, auto = !(num(d.precio) > 0);
  const segs = [['Piezas del set', k.piezas, '--c-m'], ['Caja y empaque', k.E, '--c-t']];
  const scale = Math.max(pr, k.total, 1), loss = pr < k.total && k.total > 0;
  const bar = segs.filter(s => s[1] > 0).map(s => `<i style="width:${s[1] / scale * 100}%;--s:var(${s[2]})" data-tip="${s[0]}: ${mx(s[1])}" tabindex="0"></i>`).join('') + (gan > 0 ? `<i class="gain" style="width:${gan / scale * 100}%" data-tip="Ganancia: ${mx(gan)}" tabindex="0"></i>` : '');
  const partes = k.partes;
  const legend = partes.map(x => `<tr><td><span class="lk" style="--s:var(--c-m)"></span>${x.cant > 1 ? x.cant + ' × ' : ''}${esc(x.nombre)}</td><td class="r num">${mx(x.cant * x.costo)}</td><td class="r num mut">${pr > 0 ? pct(x.cant * x.costo / pr * 100) : ''}</td></tr>`).join('') + (k.E > 0 ? `<tr><td><span class="lk" style="--s:var(--c-t)"></span>Caja y empaque</td><td class="r num">${mx(k.E)}</td><td class="r num mut">${pr > 0 ? pct(k.E / pr * 100) : ''}</td></tr>` : '');
  const status = !partes.length ? ['info', 'Agrega al menos una pieza para calcular el costo del set.']
    : pr <= 0 ? ['info', 'Falta el precio del set.']
    : loss ? ['bad', `Con este precio hay una pérdida de ${mx(k.total - pr)} por set.`]
    : pr < piso(k.total) ? ['warn', `Precio debajo del piso de margen (${mx0(piso(k.total))}). Si una impresión falla, la ganancia es casi nula.`]
    : ['good', `Ganancia de ${mx0(gan)} por set (${nf1.format(pr / k.total)} veces el costo).`];
  const dif = su - pr;
  const comp = !partes.length ? '' : `<p class="note">Las piezas sueltas suman <b>${mx0(su)}</b>. ${auto ? 'El set tiene el mismo precio que las sueltas y se ajusta si cambia el precio de una pieza.' : dif > .5 ? `Descuento del set frente a las sueltas: <b>${mx0(dif)}</b> (${pct(dif / su * 100)}).` : dif < -.5 ? `El set tiene un recargo de <b>${mx0(-dif)}</b> sobre las sueltas.` : 'El set tiene el mismo precio que las sueltas, pero se vende como colección.'}</p>`;
  const rd = v => v >= 200 ? Math.round(v / 10) * 10 : Math.round(v / 5) * 5;
  const refs = [['Igual que las sueltas', 0, mx0(su)], ...[5, 10, 15].map(x => ['−' + x + '%', Math.max(1, rd(su * (1 - x / 100))), mx0(Math.max(1, rd(su * (1 - x / 100))))]), ['Piso', Math.ceil(piso(k.total)), 'costo + ' + S.config.margenMin + '%']];
  return `
    <div class="sbar${loss ? ' loss' : ''}" role="img" aria-label="Reparto del precio del set">${bar}</div>
    <div class="kpis"><div><span class="k">Ganancia</span><b class="num ${gan >= 0 ? 'pos' : 'neg'}">${pr > 0 ? mx0(gan) : '—'}</b></div><div><span class="k">Margen</span><b class="num">${pr > 0 ? pct(gan / pr * 100) : '—'}</b></div><div><span class="k">Piezas</span><b class="num">${nPiezasCol(d)}</b></div></div>
    <p class="status ${status[0]}">${ico(status[0] === 'good' ? 'check' : 'warn', 16)}<span>${status[1]}</span></p>
    ${comp}
    <table class="tbl sm legend"><tbody>${legend}<tr class="tot"><td>Costo del set</td><td class="r num">${mx(k.total)}</td><td></td></tr>${pr > 0 && partes.length ? `<tr class="gan"><td><span class="lk gain"></span>Ganancia</td><td class="r num">${mx(gan)}</td><td class="r num mut">${pct(gan / pr * 100)}</td></tr>` : ''}</tbody></table>
    <div class="refs"><span class="k">Atajos para llenar el precio</span><div>${refs.map(r => `<button type="button" class="ref" data-act="c-precio" data-v="${r[1]}"><b>${r[2]}</b><small>${r[0]}</small></button>`).join('')}</div></div>
    <p class="hint">Vacío: vale la suma de las piezas sueltas.</p>`;
}
function refreshCol() {

  const mini = $('#c-mini'); if (mini) mini.innerHTML = `<span>Costo<b>${mx(k.total)}</b></span><span>Precio del set<b>${mx0(pr)}</b></span><span>Ganancia<b class="${pr - k.total >= 0 ? 'pos' : 'neg'}">${pr > 0 ? mx0(pr - k.total) : '—'}</b></span>`;

function updateParteRow(i) {

function colLimpia(d) {
  const o = clone(d); Object.keys(o).forEach(k => k[0] === '_' && delete o[k]);
  const m = {}; (o.partes || []).forEach(r => { if (r.prod) m[r.prod] = (m[r.prod] || 0) + cantParte(r); });
  o.partes = Object.keys(m).map(prod => ({ prod, cant: m[prod] }));

function validCol() {
  const d = cdraft;

/* un renglón por filamento: cuánto se gasta y cuánto queda entre todos sus rollos */
function matRows(mat, o = {}) {
  return Object.keys(mat).map(id => {
    const f = byId(S.filamentos, id); if (!f) return '';
    const need = mat[id] * (1 + S.config.purga / 100), rest = restanteF(id), st = o.stock !== false, short = st && need > rest + .01, nr = rollosDe(id).filter(r => restante(r) > .5).length;
    return `<span class="mrow${short ? ' bad' : ''}">${sw(f.hex)}<span>${esc(fName(f))}${st && nr > 1 ? ` <small class="inl">${nr} rollos</small>` : ''}</span><b class="num">${gfmt(need)}</b>${st ? `<small>${short ? 'faltan ' + gfmt(need - rest) : 'quedan ' + gfmt(rest - need)}</small>` : ''}</span>`;
  }).join('');
}
const dscTxt = (lista, precio) => { const d = lista > 0 ? (1 - precio / lista) * 100 : 0; return Math.abs(d) >= 1 ? `<small class="blk">${d > 0 ? '−' : '+'}${Math.round(Math.abs(d))}% vs lista</small>` : ''; };

/* ---------- desglose por pieza: etiquetas de lugar, barra de capas y la tabla ---------- */
const oriTxt = (k, o = {}) => k === 'ped' && o.ped ? 'Pedido #' + o.ped : (k === 'ok' || k === 'done') && o.n > 1 ? ORI[k] + 's' : ORI[k];
const tgs = (k, o = {}) => `<span class="tg ${k}">${esc(oriTxt(k, o))}</span>`;

const dondeHTML = (tags, o = {}) => tags.map(t => `<div class="dn">${tg(t, o)}${t.k === 'print' ? `<span class="prog mini" role="img" aria-label="${t.pct}% impreso"><i style="width:${t.pct}%"></i></span>` : ''}${t.s ? `<small>${esc(t.s)}</small>` : ''}</div>`).join('');

const capasTxt = (cuenta, o = {}) => ORI_ORDEN.filter(k => cuenta[k] > 0).map(k => cuenta[k] + ' ' + oriTxt(k, { ...o, n: cuenta[k] }).toLowerCase()).join(' · ');
const capasLeyenda = (cuenta, o = {}) => `<ul class="lg">${ORI_ORDEN.filter(k => cuenta[k] > 0).map(k => `<li><i class="${k}"></i><b class="num">${cuenta[k]}</b> ${esc(oriTxt(k, { ...o, n: cuenta[k] }))}</li>`).join('')}</ul>`;
/* D: pedDesglose(p) o ventaDesglose(v). Un set se abre en sus piezas; el resto es una sola fila. */
function desgloseHTML(D, o = {}) {

  B.lines.forEach(l => {

  ${l.length ? sumLine(`Se registraron <b>${l.length}</b> ${l.length === 1 ? 'impresión' : 'impresiones'} y se usaron <b>${nf1.format(l.reduce((a, x) => a + gr(x), 0))} g</b> de filamento. ${fall ? `<b class="${tasa > S.config.fallos ? 'r' : ''}">${fall}</b> ${fall === 1 ? 'falló' : 'fallaron'} (${pct(tasa)}); la reserva en el precio es ${pct(S.config.fallos)}.` : 'Ninguna falló.'}${nPrueba ? ` ${nPrueba} ${nPrueba === 1 ? 'fue prueba' : 'fueron pruebas'} de material (${gfmt(gPrueba)}).` : ''}`, c100Bar([['Salieron bien', l.length - fall, '--green', 'dk gan'], ['Fallaron', fall, '--red']], 0, 'Impresiones que salieron bien y que fallaron', 'sm', n => n + (n === 1 ? ' impresión' : ' impresiones'))) : sumLine('Sin impresiones registradas. Al registrar una, aquí se ve cuánto filamento se usó y cuántas fallaron.')}
  <div class="tw"><table class="tbl"><thead><tr><th>Fecha</th><th>Detalle</th><th>Impresora</th><th>Filamento</th><th class="r">Gramos</th><th class="r">Tiempo</th><th>Resultado</th></tr></thead><tbody>${grRows || `<tr><td colspan="7" class="empty-td">${mascot(48)}<p>Sin impresiones registradas.</p></td></tr>`}</tbody></table></div>`;
