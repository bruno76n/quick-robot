<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Productos, fichas con variantes</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Geist',system-ui,-apple-system,'Segoe UI',sans-serif;color:#121214;background:#fff;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
</style>

</head>
<!--
  REFERENCIA VISUAL (ronda 2): Productos en fichas, con variantes agrupadas.
  Maqueta para ver estructura, jerarquía y comportamiento. NO es código del producto.
  - Los datos, nombres y cifras son de ejemplo. No copiarlos.
  - Los textos reales salen de es.ts; esta maqueta no los define (salvo los nuevos de docs/mejoras/ronda-2.md §9).
  - Colores: solo neutros y de estado (verde, ámbar, rojo). Sin morado. La marca del negocio no aparece.
  - Los radios y sombras de componentes que ya existen se toman del sistema, no de aquí.
  - Se abre con doble clic; los despliegues y filtros funcionan.
-->
<body>
<div id="root"></div>
<template id="tpl">

<div style="display:flex;flex-wrap:wrap;width:100%;min-height:1180px;background:#ffffff;color:#121214;font-size:15px;line-height:1.45">

<!-- barra lateral -->
<aside style="width:248px;flex:none;box-sizing:border-box;background:#f6f6f8;border-right:1px solid #e7e7ec;padding:16px 12px 14px;display:flex;flex-direction:column;gap:14px">
  <div style="display:flex;align-items:center;gap:10px;padding:2px 6px">
    <div aria-hidden="true" style="flex:none;width:40px;height:40px;border-radius:10px;background:#e7e7ec;color:#3a3a43;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:15px;letter-spacing:-.02em">MN</div>
    <div style="min-width:0"><div style="font-size:19px;font-weight:600;letter-spacing:-.03em;line-height:1.1">Mi negocio</div><div style="font-size:12.5px;color:#6a6a73;margin-top:3px">Giro del negocio</div></div>
  </div>
  <button style="display:flex;align-items:center;justify-content:center;gap:8px;background:#121214;color:#fff;border:0;border-radius:9px;padding:11px 12px;font-weight:500">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Nueva pieza
  </button>
  <div style="display:flex;align-items:center;gap:8px;background:#fff;border:1px solid #d2d2da;border-radius:9px;padding:9px 10px;color:#6a6a73">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6a6a73" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M21 21l-4.3-4.3M11 18a7 7 0 1 1 0-14 7 7 0 0 1 0 14z"/></svg>
    <span style="flex:1">Buscar</span><span style="font-size:11px;border:1px solid #d2d2da;border-radius:4px;padding:0 5px">⌘K</span>
  </div>
  <nav aria-label="Pantallas" style="display:flex;flex-direction:column;gap:14px">
    <sc-for list="{{groups}}" as="g" hint-placeholder-count="4">
      <div style="display:flex;flex-direction:column;gap:2px">
        <sc-if value="{{g.label}}" hint-placeholder-val="{{ true }}"><div style="font-size:12.5px;color:#6a6a73;font-weight:600;padding:0 10px 3px">{{g.label}}</div></sc-if>
        <sc-for list="{{g.items}}" as="it" hint-placeholder-count="3">
          <a href="#" style="display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:9px;text-decoration:none;background:{{it.bg}};color:{{it.ink}};font-weight:{{it.w}}">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="{{it.ink}}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{it.d}}"/></svg>{{it.name}}
          </a>
        </sc-for>
      </div>
    </sc-for>
  </nav>
</aside>

<!-- contenido -->
<main style="flex:999 1 560px;min-width:0;box-sizing:border-box;padding:26px 44px 40px;display:flex;flex-direction:column;gap:16px">
  <header style="display:flex;flex-wrap:wrap;align-items:flex-start;justify-content:space-between;gap:12px">
    <div>
      <h1 style="margin:0;font-size:28px;line-height:1.1;font-weight:600;letter-spacing:-.04em">Productos</h1>
      <p style="margin:6px 0 0;color:#6a6a73">Piezas con su costo y su precio de lista. Las variantes viven dentro de su pieza.</p>
    </div>
    <div style="display:flex;gap:8px">
      <button style="background:#fff;border:1px solid #d2d2da;border-radius:9px;padding:10px 16px;font-weight:500">Nueva colección</button>
      <button style="background:#121214;color:#fff;border:0;border-radius:9px;padding:11px 16px;font-weight:500">+ Nueva pieza</button>
    </div>
  </header>

  <div style="display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px">
    <div style="display:flex;background:#f1f1f4;border-radius:999px;padding:4px;gap:2px">
      <span style="background:#fff;border-radius:999px;padding:7px 16px;font-weight:600;box-shadow:0 1px 2px rgba(18,18,20,.08)">Piezas <span style="color:#6a6a73;font-weight:500;font-size:13px">8</span></span>
      <span style="padding:7px 16px;color:#6a6a73;font-weight:500">Colecciones <span style="font-size:13px">2</span></span>
    </div>
    <div style="display:flex;align-items:center;gap:10px">
      <div style="border:1px solid #d2d2da;border-radius:9px;padding:10px 14px;color:#6a6a73;width:230px;box-sizing:border-box">Buscar pieza</div>
      <div style="display:flex;background:#f1f1f4;border-radius:999px;padding:4px">
        <span style="background:#fff;border-radius:999px;padding:6px 14px;font-weight:600;font-size:14px;box-shadow:0 1px 2px rgba(18,18,20,.08)">Fichas</span>
        <span style="padding:6px 14px;color:#6a6a73;font-weight:500;font-size:14px">Lista</span>
      </div>
    </div>
  </div>

  <div style="display:flex;flex-wrap:wrap;gap:8px">
    <span style="background:#121214;color:#fff;border-radius:999px;padding:6px 14px;font-weight:600;font-size:14px">Todas <span style="font-weight:500;opacity:.8">8</span></span>
    <span style="background:#f1f1f4;color:#4a4a53;border-radius:999px;padding:6px 14px;font-weight:500;font-size:14px">Técnicas <span>1</span></span>
    <span style="background:#f1f1f4;color:#3a3a43;border-radius:999px;padding:6px 14px;font-weight:500;font-size:14px">Con variantes <span>1</span></span>
  </div>

  <sc-for list="{{rows}}" as="row" hint-placeholder-count="2">
    <section style="display:flex;flex-direction:column;gap:16px">
      <div style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px">
        <sc-for list="{{row.cards}}" as="c" hint-placeholder-count="4">
          <article style="box-sizing:border-box;border:2px solid {{c.border}};border-radius:5px;background:#fff;padding:7px;display:flex;flex-direction:column;gap:10px;min-height:300px">
            <div style="position:relative;height:104px;background:#f6f6f8;border-radius:4px;display:flex;align-items:center;justify-content:center">
              <sc-if value="{{c.tag}}" hint-placeholder-val="{{ false }}"><span style="position:absolute;left:8px;top:8px;background:#fff;border-radius:999px;padding:2px 10px;font-size:12.5px;font-weight:500">{{c.tag}}</span></sc-if>
              <div style="width:62px;height:54px;border-radius:31px 31px 8px 8px;background:{{c.thumb}}"></div>
            </div>
            <div style="padding:0 5px;display:flex;flex-direction:column;gap:3px;flex:1">
              <div style="font-weight:600;font-size:16px;letter-spacing:-.01em">{{c.name}}</div>
              <div style="font-size:13px;color:#6a6a73">{{c.printer}}</div>
              <div style="display:flex;align-items:baseline;gap:8px;margin-top:4px"><span style="font-size:28px;font-weight:600;letter-spacing:-.03em">{{c.price}}</span><span style="font-size:13px;font-weight:600;color:#067a30">Ganas {{c.profit}} · {{c.times}}</span></div>
              <div style="display:flex;height:8px;border-radius:2px;overflow:hidden;background:#00ae42;margin-top:2px"><div style="width:{{c.costPct}}%;background:#5a5a65"></div></div>
              <div style="display:flex;justify-content:space-between;font-size:13px;color:#6a6a73;margin-top:2px"><span>Costo {{c.cost}}</span><span>{{c.sold}} vendidas</span></div>
              <div style="display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;margin-top:auto;padding-top:8px">
                <span style="background:{{c.stBg}};color:{{c.stInk}};border-radius:999px;padding:3px 11px;font-size:13px;font-weight:500;white-space:nowrap">{{c.stock}}</span>
                <sc-if value="{{c.variants}}" hint-placeholder-val="{{ false }}">
                  <button onClick="{{c.toggle}}" aria-expanded="{{c.expanded}}" style="display:flex;align-items:center;gap:6px;background:#f1f1f4;color:#3a3a43;border:0;border-radius:999px;padding:4px 10px 4px 12px;font-size:13px;font-weight:600;white-space:nowrap">{{c.variantsLabel}}
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#3a3a43" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="transform:rotate({{c.rot}}deg)"><path d="m6 9 6 6 6-6"/></svg>
                  </button>
                </sc-if>
              </div>
            </div>
          </article>
        </sc-for>
      </div>

      <sc-if value="{{row.panel}}" hint-placeholder-val="{{ false }}">
        <div style="position:relative;margin-top:-2px">
          <div style="position:absolute;top:-9px;left:calc({{row.notch}}% - 8px);width:14px;height:14px;background:#fff;border-left:2px solid #121214;border-top:2px solid #121214;transform:rotate(45deg)"></div>
          <div style="border:2px solid #121214;border-radius:5px;background:#fff;padding:16px 20px 8px">
            <div style="display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;padding-bottom:10px">
              <div><div style="font-size:16px;font-weight:600">Variantes de {{row.panelName}}</div><div style="font-size:13px;color:#6a6a73;margin-top:2px">Misma pieza con otro material o color. Cada una se vende y se cuenta en Existencias por separado.</div></div>
              <button style="background:#fff;border:1px solid #d2d2da;border-radius:9px;padding:8px 14px;font-weight:500;font-size:14px">+ Nueva variante</button>
            </div>
            <div style="display:grid;grid-template-columns:minmax(180px,2.2fr) minmax(0,1.4fr) repeat(3,minmax(0,.8fr)) minmax(0,1.3fr) minmax(0,.7fr) 150px;column-gap:12px;font-size:12.5px;color:#6a6a73;font-weight:600;padding:6px 0;border-bottom:1px solid #e7e7ec">
              <span>Variante</span><span>Material</span><span style="text-align:right">Costo</span><span style="text-align:right">Precio</span><span style="text-align:right">Ganancia</span><span style="text-align:right">En existencia</span><span style="text-align:right">Vendidas</span><span></span>
            </div>
            <sc-for list="{{row.variantRows}}" as="v" hint-placeholder-count="3">
              <div style="display:grid;grid-template-columns:minmax(180px,2.2fr) minmax(0,1.4fr) repeat(3,minmax(0,.8fr)) minmax(0,1.3fr) minmax(0,.7fr) 150px;column-gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid #f0f0f3">
                <span style="display:flex;align-items:center;gap:10px;font-weight:600"><span style="width:18px;height:18px;border-radius:50%;background:{{v.sw}};border:1px solid rgba(18,18,20,.15);flex:none"></span>{{v.name}}<sc-if value="{{v.original}}" hint-placeholder-val="{{ false }}"><span style="background:#f1f1f4;color:#4a4a53;border-radius:999px;padding:1px 9px;font-size:12px;font-weight:500">Original</span></sc-if></span>
                <span style="color:#4a4a53">{{v.material}}</span>
                <span style="text-align:right;font-variant-numeric:tabular-nums">{{v.cost}}</span>
                <span style="text-align:right;font-weight:600;font-variant-numeric:tabular-nums">{{v.price}}</span>
                <span style="text-align:right;color:#067a30;font-weight:600;font-variant-numeric:tabular-nums">{{v.profit}}</span>
                <span style="text-align:right;font-variant-numeric:tabular-nums"><b>{{v.free}}</b><span style="display:block;font-size:12.5px;color:#6a6a73">{{v.reserved}}</span></span>
                <span style="text-align:right;font-variant-numeric:tabular-nums">{{v.sold}}</span>
                <span style="display:flex;gap:6px;justify-content:flex-end"><button style="background:#fff;border:1px solid #d2d2da;border-radius:9px;padding:6px 14px;font-weight:500;font-size:14px">Vender</button><button style="background:transparent;border:0;border-radius:9px;padding:6px 8px;color:#6a6a73;font-size:14px">Editar</button></span>
              </div>
            </sc-for>
          </div>
        </div>
      </sc-if>
    </section>
  </sc-for>
</main>
</div>
</template>
<script>

class DCLogic {
  constructor(props) { this.props = props || {}; this.state = {}; }
  setState(p) { Object.assign(this.state, typeof p === 'function' ? p(this.state) : p); render(); }
}


class Component extends DCLogic {
  constructor(props) { super(props); this.state = { open: 'salto' }; }
  renderVals() {
    const open = this.state.open;
    const nav = [
      { label: '', items: [['Inicio', 'M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z']] },
      { label: 'Vender', items: [['Productos', 'M21 8 12 3 3 8v8l9 5 9-5z M3 8l9 5 9-5 M12 13v8', 1], ['Ventas', 'M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18z M12 7v10 M15 9.5c-.5-1-1.600-1.500-3-1.500-1.700 0-3 .8-3 2s1.300 1.600 3 2 3 .8 3 2-1.300 2-3 2c-1.400 0-2.500-.5-3-1.500'], ['Pedidos', 'M9 4h6v3H9z M7 5H6a1 1 0 0 0-1 1v14a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V6a1 1 0 0 0-1-1h-1 M9 12h6 M9 16h6']] },
      { label: 'Taller', items: [['Filamentos', 'M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18z M12 9a3 3 0 1 0 0 6 3 3 0 0 0 0-6z'], ['Insumos', 'M12 3l7.800 4.500v9L12 21l-7.800-4.500v-9z M12 9a3 3 0 1 0 0 6 3 3 0 0 0 0-6z'], ['Impresoras', 'M4 4h16v10H4z M4 18h16 M8 14v4 M16 14v4'], ['Producción', 'M12 3 3 8l9 5 9-5z M3 13l9 5 9-5'], ['Existencias', 'M5 5h14v5H5z M5 14h14v5H5z M8 7.500h.01 M8 16.500h.01'], ['Compras', 'M3 4h2l2.400 11h10.200L20 8H6.500 M9 20h.01 M17 20h.01']] },
      { label: 'Negocio', items: [['Clientes', 'M16 20v-1.500a3.500 3.500 0 0 0-3.500-3.500h-3A3.500 3.500 0 0 0 6 18.500V20 M11 11.500a3.500 3.500 0 1 0 0-7 3.500 3.500 0 0 0 0 7z'], ['Gastos', 'M3 7h16a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z M3 7l2-3h12 M16 14h2'], ['Reportes', 'M4 20V4 M4 20h16 M9 16v-5 M14 16V8 M19 16v-3'], ['Ajustes', 'M12 9a3 3 0 1 0 0 6 3 3 0 0 0 0-6z M12 3v3 M12 18v3 M3 12h3 M18 12h3 M5.600 5.600l2.100 2.100 M16.300 16.300l2.100 2.100 M5.600 18.400l2.100-2.100 M16.300 7.700l2.100-2.100']] }
    ];
    const groups = nav.map(g => ({ label: g.label, items: g.items.map(i => ({ name: i[0], d: i[1], bg: i[2] ? '#ececf1' : 'transparent', ink: i[2] ? '#121214' : '#6a6a73', w: i[2] ? 600 : 500 })) }));

    const G = { red: 'linear-gradient(135deg,#e8506a,#b3223f)', black: 'linear-gradient(135deg,#3a3a44,#121214)', white: 'linear-gradient(135deg,#ffffff,#d9d9df)' };
    const base = [
      { id: 'llavero', name: 'Llavero con nombre', printer: 'Ender 3 V3 SE', price: '$50', profit: '$46', times: '×13.6', cost: '$3.67', cp: 7.3, sold: 33, stock: '6 libres · 3 apartadas', st: 'n', thumb: G.red },
      { id: 'servilletero', name: 'Servilletero con logo', printer: 'Bambu Lab P1S', price: '$120', profit: '$93', times: '×4.5', cost: '$26.75', cp: 22.3, sold: 24, stock: 'Solo por pedido', st: 'n', thumb: G.black },
      { id: 'salto', name: 'Spider-Man · salto', printer: 'Bambu Lab P1S', price: '$250', profit: '$211', times: '×6.4', cost: '$38.96', cp: 15.6, sold: 10, stock: '1 libre · 2 apartadas', st: 'n', thumb: G.white, nvar: 2 },
      { id: 'trepando', name: 'Spider-Man · trepando', printer: 'Bambu Lab P1S', price: '$250', profit: '$214', times: '×6.9', cost: '$36.35', cp: 14.5, sold: 9, stock: 'Todo apartado', st: 'w', thumb: G.white },
      { id: 'doom', name: 'Doctor Doom · busto', printer: 'Bambu Lab P1S', price: '$250', profit: '$208', times: '×6', cost: '$41.56', cp: 16.6, sold: 6, stock: '1 libre · 2 apartadas', st: 'n', thumb: G.white },
      { id: 'hulk', name: 'Hulk · puño', printer: 'Bambu Lab P1S', price: '$250', profit: '$212', times: '×6.6', cost: '$37.90', cp: 15.2, sold: 7, stock: '2 libres · 1 apartada', st: 'n', thumb: G.white },
      { id: 'soporte', name: 'Soporte de celular PETG', printer: 'Bambu Lab P1S', price: '$79', profit: '$40', times: '×2', cost: '$39.28', cp: 49.7, sold: 3, stock: '2 libres', st: 'n', thumb: G.black, tag: 'Técnica' },
      { id: 'letrero', name: 'Letrero de taquería', printer: 'Bambu Lab P1S', price: '$450', profit: '$381', times: '×6.5', cost: '$68.89', cp: 15.3, sold: 2, stock: 'Solo por pedido', st: 'n', thumb: 'linear-gradient(180deg,#f4f4f6 55%,#d6334f 55%)' }
    ];
    const variantData = {
      salto: [
        { name: 'Blanco', original: true, sw: '#f4f4f6', material: 'PLA Blanco', cost: '$38.96', price: '$250', profit: '$211', free: '1 libre', reserved: '2 apartadas', sold: 10 },
        { name: 'Silk morado', sw: '#6b3fd4', material: 'PLA Silk Morado', cost: '$44.80', price: '$250', profit: '$205', free: '1 libre', reserved: '0 apartadas', sold: 2 },
        { name: 'Negro mate', sw: '#26262c', material: 'PLA Negro', cost: '$38.96', price: '$250', profit: '$211', free: '2 libres', reserved: '1 apartada', sold: 3 }
      ]
    };
    const cards = base.map((b, i) => {
      const isOpen = open === b.id;
      const has = !!b.nvar;
      return {
        ...b, costPct: b.cp, variants: has,
        variantsLabel: b.nvar + ' variantes', rot: isOpen ? 180 : 0, expanded: isOpen ? 'true' : 'false',
        border: isOpen ? '#121214' : '#e7e7ec',
        stBg: b.st === 'w' ? '#fff1d3' : '#ececf1', stInk: b.st === 'w' ? '#86500a' : '#3a3a43',
        toggle: () => this.setState({ open: isOpen ? null : b.id })
      };
    });
    const rows = [];
    for (let r = 0; r < cards.length; r += 4) {
      const cs = cards.slice(r, r + 4);
      const idx = cs.findIndex(c => c.id === open);
      const o = idx >= 0 ? cs[idx] : null;
      rows.push({
        cards: cs, panel: !!o, notch: o ? ((idx + 0.5) / 4 * 100) : 0, panelName: o ? o.name : '',
        variantRows: o ? variantData[o.id] || [] : []
      });
    }
    return { groups, rows };
  }
}


const __tpl = document.getElementById('tpl').content;
const __root = document.getElementById('root');
const __comp = new Component({});
const __get = (scope, p) => { let v = scope; for (const k of p.split('.')) { if (v == null) return undefined; v = v[k]; } return v; };
const __hole = s => { const m = /^\s*\{\{\s*([\w.$]+)\s*\}\}\s*$/.exec(s || ''); return m ? m[1] : null; };
const __interp = (s, scope) => s.replace(/\{\{\s*([\w.$]+)\s*\}\}/g, (m, p) => { const v = __get(scope, p); return v == null ? '' : String(v); });
function __build(node, scope, parent) {
  if (node.nodeType === 3) { parent.appendChild(document.createTextNode(__interp(node.textContent, scope))); return; }
  if (node.nodeType !== 1) return;
  const tag = node.localName;
  if (tag === 'sc-for') {
    const list = __get(scope, __hole(node.getAttribute('list'))) || [];
    const as = node.getAttribute('as');
    list.forEach(item => { const s = Object.create(scope); s[as] = item; node.childNodes.forEach(c => __build(c, s, parent)); });
    return;
  }
  if (tag === 'sc-if') {
    if (__get(scope, __hole(node.getAttribute('value')))) node.childNodes.forEach(c => __build(c, scope, parent));
    return;
  }
  const el = document.createElementNS(node.namespaceURI, tag);
  for (const a of Array.from(node.attributes)) {
    if (a.name.startsWith('hint-')) continue;
    const h = __hole(a.value);
    if (a.name.startsWith('on') && h) { const fn = __get(scope, h); if (typeof fn === 'function') el.addEventListener(a.name.slice(2), ev => { ev.preventDefault(); fn(ev); }); continue; }
    el.setAttribute(a.name, __interp(a.value, scope));
  }
  node.childNodes.forEach(c => __build(c, scope, el));
  parent.appendChild(el);
}
function render() {
  const scope = __comp.renderVals();
  const frag = document.createDocumentFragment();
  __tpl.childNodes.forEach(c => __build(c, scope, frag));
  __root.replaceChildren(frag);
}
render();

</script>
</body>
</html>
