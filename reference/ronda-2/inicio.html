<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inicio con alertas mejoradas</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Geist',system-ui,-apple-system,'Segoe UI',sans-serif;color:#121214;background:#fff;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
</style>

</head>
<!--
  REFERENCIA VISUAL (ronda 2): Inicio con atención por prioridad.
  Maqueta para ver estructura, jerarquía y comportamiento. NO es código del producto.
  - Los datos, nombres y cifras son de ejemplo. No copiarlos.
  - Los textos reales salen de es.ts; esta maqueta no los define (salvo los nuevos de docs/mejoras/ronda-2.md §9).
  - Colores: solo neutros y de estado (verde, ámbar, rojo). Sin morado. La marca del negocio no aparece.
  - Los radios y sombras de componentes que ya existen se toman del sistema, no de aquí.
  - Se abre con doble clic; los despliegues y filtros funcionan.
-->
<body>
<div id="root"></div>
<template id="tpl">

<div style="display:flex;flex-wrap:wrap;width:100%;min-height:1240px;background:#ffffff;color:#121214;font-size:15px;line-height:1.45">

<aside style="width:248px;flex:none;box-sizing:border-box;background:#f6f6f8;border-right:1px solid #e7e7ec;padding:16px 12px 14px;display:flex;flex-direction:column;gap:14px">
  <div style="display:flex;align-items:center;gap:10px;padding:2px 6px">
    <div aria-hidden="true" style="flex:none;width:40px;height:40px;border-radius:10px;background:#e7e7ec;color:#3a3a43;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:15px;letter-spacing:-.02em">MN</div>
    <div style="min-width:0"><div style="font-size:19px;font-weight:600;letter-spacing:-.03em;line-height:1.1">Mi negocio</div><div style="font-size:12.5px;color:#6a6a73;margin-top:3px">Giro del negocio</div></div>
  </div>
  <button style="display:flex;align-items:center;justify-content:center;gap:8px;background:#121214;color:#fff;border:0;border-radius:9px;padding:11px 12px;font-weight:500">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Nueva pieza
  </button>
  <div style="display:flex;align-items:center;gap:8px;background:#fff;border:1px solid #d2d2da;border-radius:9px;padding:9px 10px;color:#6a6a73">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6a6a73" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M21 21l-4.3-4.3M11 18a7 7 0 1 1 0-14 7 7 0 0 1 0 14z"/></svg>
    <span style="flex:1">Buscar</span><span style="font-size:11px;border:1px solid #d2d2da;border-radius:4px;padding:0 5px">⌘K</span>
  </div>
  <nav aria-label="Pantallas" style="display:flex;flex-direction:column;gap:14px">
    <sc-for list="{{groups}}" as="g" hint-placeholder-count="4">
      <div style="display:flex;flex-direction:column;gap:2px">
        <sc-if value="{{g.label}}" hint-placeholder-val="{{ true }}"><div style="font-size:12.5px;color:#6a6a73;font-weight:600;padding:0 10px 3px">{{g.label}}</div></sc-if>
        <sc-for list="{{g.items}}" as="it" hint-placeholder-count="3">
          <a href="#" style="display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:9px;text-decoration:none;background:{{it.bg}};color:{{it.ink}};font-weight:{{it.w}}">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="{{it.ink}}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{it.d}}"/></svg>{{it.name}}
          </a>
        </sc-for>
      </div>
    </sc-for>
  </nav>
</aside>

<main style="flex:999 1 560px;min-width:0;box-sizing:border-box;padding:26px 44px 40px;display:flex;flex-direction:column;gap:24px">
  <header style="display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px">
    <h1 style="margin:0;font-size:28px;line-height:1.1;font-weight:600;letter-spacing:-.04em">Inicio</h1>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <button style="background:#fff;border:1px solid #d2d2da;border-radius:9px;padding:10px 16px;font-weight:500">Nuevo pedido</button>
      <button style="background:#fff;border:1px solid #d2d2da;border-radius:9px;padding:10px 16px;font-weight:500">Registrar venta</button>
      <button style="background:#121214;color:#fff;border:0;border-radius:9px;padding:11px 16px;font-weight:500">+ Nueva pieza</button>
    </div>
  </header>

  <section aria-label="Resumen de los últimos 30 días" style="background:#f6f6f8;border-radius:20px;padding:26px 28px;display:flex;flex-wrap:wrap;gap:28px 40px;align-items:flex-start">
    <div style="flex:1.2 1 380px;min-width:0;display:flex;flex-direction:column;gap:16px">
      <p style="margin:0;font-size:28px;line-height:1.22;font-weight:500;letter-spacing:-.03em">Se vendieron <b style="font-weight:600">$6,270</b> en 13 ventas en los últimos 30 días. Después de costo y comisiones quedaron <b style="font-weight:600;color:#067a30">$5,077</b> de ganancia, y tras los gastos del negocio <b style="font-weight:600;color:#067a30">$2,370</b>.</p>
      <div style="display:flex;flex-wrap:wrap;align-items:center;gap:8px">
        <span style="background:#e3f5e9;color:#067a30;border-radius:999px;padding:3px 12px;font-size:13.5px;font-weight:600">Ventas ▲ 14.6%</span>
        <span style="background:#e3f5e9;color:#067a30;border-radius:999px;padding:3px 12px;font-size:13.5px;font-weight:600">Ganancia ▲ 17.6%</span>
        <span style="background:#fde8ec;color:#b3223f;border-radius:999px;padding:3px 12px;font-size:13.5px;font-weight:600">Gastos ▲ 71.7%</span>
      </div>
      <div style="font-size:13px;color:#6a6a73">contra el periodo anterior</div>
    </div>

    <div style="flex:1 1 360px;min-width:0;display:flex;flex-direction:column;gap:12px">
      <div style="font-size:14px;color:#6a6a73;font-weight:500">De cada $100 vendidos, a dónde se va</div>
      <div role="img" aria-label="De cada $100 vendidos: $43 gastos del negocio y $38 ganancia real" style="display:flex;gap:2px;height:46px">
        <sc-for list="{{segs}}" as="s" hint-placeholder-count="8">
          <span style="flex:{{s.per}} 1 0%;min-width:3px;background:{{s.color}};border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;color:{{s.ink}};overflow:hidden">{{s.label}}</span>
        </sc-for>
      </div>
      <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 28px">
        <sc-for list="{{legend}}" as="l" hint-placeholder-count="8">
          <div style="display:flex;align-items:center;gap:8px;font-size:14px;min-width:0">
            <span style="flex:none;width:10px;height:10px;border-radius:3px;background:{{l.color}}"></span>
            <span style="font-weight:{{l.w}};color:{{l.ink}};white-space:nowrap">{{l.name}}</span>
            <span style="font-size:12.5px;color:#6a6a73;white-space:nowrap">{{l.amount}}</span>
            <span style="flex:1;text-align:right;font-weight:600;color:{{l.ink}};font-variant-numeric:tabular-nums">{{l.per}}</span>
          </div>
        </sc-for>
      </div>
    </div>
  </section>

  <div style="display:flex;flex-wrap:wrap;gap:28px;align-items:flex-start">

    <section aria-label="Atención" style="flex:2 1 520px;min-width:0;display:flex;flex-direction:column;gap:12px">
      <div style="display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px">
        <h2 style="margin:0;font-size:20px;font-weight:600;letter-spacing:-.03em">Atención</h2>
        <div style="display:flex;flex-wrap:wrap;gap:8px">
          <sc-for list="{{chips}}" as="c" hint-placeholder-count="4">
            <button onClick="{{c.pick}}" aria-pressed="{{c.pressed}}" style="border:0;border-radius:999px;padding:6px 14px;font-size:14px;font-weight:{{c.w}};background:{{c.bg}};color:{{c.ink}}">{{c.label}} <span style="font-weight:500;opacity:.85">{{c.n}}</span></button>
          </sc-for>
        </div>
      </div>

      <div style="display:flex;flex-direction:column">
        <sc-for list="{{items}}" as="a" hint-placeholder-count="7">
          <div>
            <sc-if value="{{a.showHead}}" hint-placeholder-val="{{ true }}">
              <div style="display:flex;align-items:baseline;gap:8px;padding:{{a.headPad}}">
                <span style="width:8px;height:8px;border-radius:50%;background:{{a.dot}};align-self:center"></span>
                <span style="font-weight:600">{{a.groupName}}</span>
                <span style="font-size:13px;color:#6a6a73">{{a.groupNote}}</span>
              </div>
            </sc-if>
            <div style="display:flex;flex-wrap:wrap;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid #eeeef2">
              <span style="flex:none;width:36px;height:36px;border-radius:10px;background:{{a.bg}};display:flex;align-items:center;justify-content:center">
                <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="{{a.ink}}" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{a.icon}}"/></svg>
              </span>
              <div style="flex:1 1 280px;min-width:0;line-height:1.35">
                <sc-for list="{{a.parts}}" as="p" hint-placeholder-count="5"><span style="font-weight:{{p.w}}">{{p.t}}</span></sc-for>
              </div>
              <button style="flex:none;background:#fff;border:1px solid #d2d2da;border-radius:9px;padding:7px 13px;font-weight:500;font-size:14px;white-space:nowrap">{{a.action}}</button>
            </div>
          </div>
        </sc-for>
      </div>
    </section>

    <aside style="flex:1 1 320px;max-width:420px;min-width:0;display:flex;flex-direction:column;gap:28px">
      <section style="display:flex;flex-direction:column;gap:14px">
        <h2 style="margin:0;font-size:20px;font-weight:600;letter-spacing:-.03em">Piezas con más ganancia</h2>
        <sc-for list="{{top}}" as="t" hint-placeholder-count="5">
          <div style="display:flex;align-items:center;gap:12px">
            <div style="flex:none;width:44px;height:44px;border-radius:10px;background:#f6f6f8;display:flex;align-items:center;justify-content:center"><div style="width:26px;height:22px;border-radius:13px 13px 4px 4px;background:{{t.thumb}}"></div></div>
            <div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:4px">
              <div style="display:flex;justify-content:space-between;gap:8px"><span style="font-weight:600">{{t.name}}</span><span style="font-variant-numeric:tabular-nums">{{t.gain}}</span></div>
              <div style="height:8px;background:#ececf1;border-radius:4px"><div style="height:8px;width:{{t.w}};background:#00ae42;border-radius:4px"></div></div>
              <div style="font-size:12.5px;color:#6a6a73">{{t.sold}}</div>
            </div>
          </div>
        </sc-for>
      </section>

      <section style="display:flex;flex-direction:column;gap:12px">
        <h2 style="margin:0;font-size:20px;font-weight:600;letter-spacing:-.03em">Impresoras</h2>
        <sc-for list="{{printers}}" as="p" hint-placeholder-count="2">
          <div style="background:#f6f6f8;border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:8px">
            <div style="display:flex;justify-content:space-between;gap:8px"><span style="font-weight:600">{{p.job}}</span><span style="font-variant-numeric:tabular-nums;font-weight:500">{{p.pct}}</span></div>
            <div style="font-size:12.5px;color:#6a6a73">{{p.line}}</div>
            <div style="height:6px;background:#ececf1;border-radius:3px"><div style="height:6px;width:{{p.pct}};background:#5a5a65;border-radius:3px"></div></div>
          </div>
        </sc-for>
      </section>
    </aside>
  </div>
</main>
</div>
</template>
<script>

class DCLogic {
  constructor(props) { this.props = props || {}; this.state = {}; }
  setState(p) { Object.assign(this.state, typeof p === 'function' ? p(this.state) : p); render(); }
}


class Component extends DCLogic {
  constructor(props) { super(props); this.state = { filter: 'all' }; }
  renderVals() {
    const nav = [
      { label: '', items: [['Inicio', 'M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z', 1]] },
      { label: 'Vender', items: [['Productos', 'M21 8 12 3 3 8v8l9 5 9-5z M3 8l9 5 9-5 M12 13v8'], ['Ventas', 'M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18z M12 7v10 M15 9.5c-.5-1-1.6-1.5-3-1.5-1.7 0-3 .8-3 2s1.3 1.6 3 2 3 .8 3 2-1.3 2-3 2c-1.4 0-2.5-.5-3-1.5'], ['Pedidos', 'M9 4h6v3H9z M7 5H6a1 1 0 0 0-1 1v14a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V6a1 1 0 0 0-1-1h-1 M9 12h6 M9 16h6']] },
      { label: 'Taller', items: [['Filamentos', 'M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18z M12 9a3 3 0 1 0 0 6 3 3 0 0 0 0-6z'], ['Insumos', 'M12 3l7.8 4.5v9L12 21l-7.8-4.5v-9z M12 9a3 3 0 1 0 0 6 3 3 0 0 0 0-6z'], ['Impresoras', 'M4 4h16v10H4z M4 18h16 M8 14v4 M16 14v4'], ['Producción', 'M12 3 3 8l9 5 9-5z M3 13l9 5 9-5'], ['Existencias', 'M5 5h14v5H5z M5 14h14v5H5z M8 7.5h.01 M8 16.5h.01'], ['Compras', 'M3 4h2l2.4 11h10.2L20 8H6.5 M9 20h.01 M17 20h.01']] },
      { label: 'Negocio', items: [['Clientes', 'M16 20v-1.5a3.5 3.5 0 0 0-3.5-3.5h-3A3.5 3.5 0 0 0 6 18.5V20 M11 11.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7z'], ['Gastos', 'M3 7h16a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z M3 7l2-3h12 M16 14h2'], ['Reportes', 'M4 20V4 M4 20h16 M9 16v-5 M14 16V8 M19 16v-3'], ['Ajustes', 'M12 9a3 3 0 1 0 0 6 3 3 0 0 0 0-6z M12 3v3 M12 18v3 M3 12h3 M18 12h3 M5.6 5.6l2.1 2.1 M16.3 16.3l2.1 2.1 M5.6 18.4l2.1-2.1 M16.3 7.7l2.1-2.1']] }
    ];
    const groups = nav.map(g => ({ label: g.label, items: g.items.map(i => ({ name: i[0], d: i[1], bg: i[2] ? '#ececf1' : 'transparent', ink: i[2] ? '#121214' : '#6a6a73', w: i[2] ? 600 : 500 })) }));

    const B = [
      ['Material', '$545', '$8.7', 8.7, '#2d2d36', '#ffffff'],
      ['Máquina', '$339', '$5.4', 5.4, '#8a8a99', '#ffffff'],
      ['Fallos (reserva)', '$55', '$0.9', 0.9, '#e3a8b8', '#121214'],
      ['Luz', '$42', '$0.7', 0.7, '#c9c9d2', '#121214'],
      ['Extras', '$127', '$2', 2, '#e6e6ec', '#121214'],
      ['Comisiones', '$85', '$1.4', 1.4, '#3f86c9', '#ffffff'],
      ['Gastos del negocio', '$2,707', '$43', 43, '#c9ab7d', '#121214'],
      ['Ganancia real', '$2,370', '$38', 38, '#00ae42', '#06330f']
    ];
    const segs = B.map(b => ({ per: b[3], color: b[4], ink: b[5], label: b[3] >= 20 ? b[2] : '' }));
    const order = [0, 1, 2, 6, 3, 4, 5, 7];
    const legend = order.map(i => { const b = B[i]; const good = i === 7; return { name: b[0], amount: b[1], per: b[2], color: b[4], w: good ? 600 : 500, ink: good ? '#067a30' : '#121214' }; });

    const L = {
      u: { name: 'Urgente', note: 'Bloquea una impresión o vence hoy o mañana', dot: '#b3223f', bg: '#fde8ec', ink: '#b3223f' },
      w: { name: 'Esta semana', note: 'Conviene resolverlo pronto', dot: '#c98408', bg: '#fff1d3', ink: '#86500a' },
      r: { name: 'Para revisar', note: 'Sin prisa', dot: '#6a6a73', bg: '#ececf1', ink: '#3a3a43' }
    };
    const I = {
      fil: 'M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18z M12 9a3 3 0 1 0 0 6 3 3 0 0 0 0-6z',
      ped: 'M9 4h6v3H9z M7 5H6a1 1 0 0 0-1 1v14a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V6a1 1 0 0 0-1-1h-1 M9 12h6 M9 16h6',
      cash: 'M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18z M12 7v10 M15 9.5c-.5-1-1.6-1.5-3-1.5-1.7 0-3 .8-3 2s1.3 1.6 3 2 3 .8 3 2-1.3 2-3 2c-1.4 0-2.5-.5-3-1.5',
      gear: 'M12 9a3 3 0 1 0 0 6 3 3 0 0 0 0-6z M12 3v3 M12 18v3 M3 12h3 M18 12h3 M5.6 5.6l2.1 2.1 M16.3 16.3l2.1 2.1 M5.6 18.4l2.1-2.1 M16.3 7.7l2.1-2.1',
      pct: 'M5 19 19 5 M7 7h.01 M17 17h.01'
    };
    const T = (t, b) => ({ t, w: b ? 600 : 400 });
    const all = [
      { l: 'u', ic: 'fil', parts: [T('Pedido '), T('#5', 1), T(' de '), T('Tacos El Güero', 1), T(': faltan '), T('535 g', 1), T(' de PLA Negro (disponible 410 g).')], action: 'Agregar rollo' },
      { l: 'u', ic: 'ped', parts: [T('Pedido '), T('#2', 1), T(' de '), T('Mariana R.', 1), T(': entrega mañana (listo para entregar).')], action: 'Abrir pedido' },
      { l: 'w', ic: 'ped', parts: [T('Pedido '), T('#3', 1), T(' de '), T('Taquería Los Compadres', 1), T(': entrega en 2 días.')], action: 'Abrir pedido' },
      { l: 'w', ic: 'cash', parts: [T('Venta del '), T('31 oct', 1), T(' a '), T('Mariana R.', 1), T(': faltan '), T('$500', 1), T(' por cobrar.')], action: 'Registrar abono' },
      { l: 'w', ic: 'fil', parts: [T('PLA Silk Morado', 1), T(': stock bajo, disponible 85 g.')], action: 'Ver filamento' },
      { l: 'r', ic: 'gear', parts: [T('Bambu Lab P1S', 1), T(': lubricar ejes (pasó por 12 h).')], action: 'Ver impresoras' },
      { l: 'r', ic: 'pct', parts: [T('Soporte de celular PETG', 1), T(': precio de lista por debajo del piso.')], action: 'Abrir pieza' }
    ];
    const f = this.state.filter;
    const count = k => all.filter(a => k === 'all' || a.l === k).length;
    const chips = [['all', 'Todas'], ['u', 'Urgente'], ['w', 'Esta semana'], ['r', 'Para revisar']].map(([k, label]) => {
      const on = f === k;
      const tone = k === 'all' ? { bg: '#ececf1', ink: '#3a3a43' } : { bg: L[k].bg, ink: L[k].ink };
      return { label, n: count(k), pressed: on ? 'true' : 'false', pick: () => this.setState({ filter: k }), bg: on ? '#121214' : tone.bg, ink: on ? '#ffffff' : tone.ink, w: on ? 600 : 500 };
    });
    let prev = null;
    const items = all.filter(a => f === 'all' || a.l === f).map((a, i) => {
      const head = f === 'all' && a.l !== prev;
      prev = a.l;
      return {
        showHead: head, headPad: i === 0 ? '4px 4px 8px' : '22px 4px 8px',
        groupName: L[a.l].name, groupNote: L[a.l].note, dot: L[a.l].dot,
        bg: L[a.l].bg, ink: L[a.l].ink, icon: I[a.ic], parts: a.parts, action: a.action
      };
    });

    const G = { white: 'linear-gradient(135deg,#ffffff,#d9d9df)', red: 'linear-gradient(135deg,#e8506a,#b3223f)', black: 'linear-gradient(135deg,#3a3a44,#121214)' };
    const top = [
      { name: 'Spider-Man · salto', gain: '$1,013', w: '100%', thumb: G.white, sold: '5 vendidas · precio ×5.8 el costo' },
      { name: 'Spider-Man · trepando', gain: '$792', w: '78%', thumb: G.white, sold: '4 vendidas · precio ×5.9 el costo' },
      { name: 'Hulk · puño', gain: '$751', w: '74%', thumb: G.white, sold: '4 vendidas · precio ×6.1 el costo' },
      { name: 'Llavero con nombre', gain: '$700', w: '69%', thumb: G.red, sold: '19 vendidas · precio ×11 el costo' },
      { name: 'Servilletero con logo', gain: '$666', w: '66%', thumb: G.black, sold: '8 vendidas · precio ×4.1 el costo' }
    ];
    const printers = [
      { job: '3 × Letrero de taquería', pct: '62%', line: 'Bambu Lab P1S · quedan 6 h 50 min · pedido #3' },
      { job: '10 × Servilletero con logo', pct: '30%', line: 'Ender 3 V3 SE · quedan 17 h 30 min · pedido #3 · 1 en cola' }
    ];
    return { groups, segs, legend, chips, items, top, printers };
  }
}


const __tpl = document.getElementById('tpl').content;
const __root = document.getElementById('root');
const __comp = new Component({});
const __get = (scope, p) => { let v = scope; for (const k of p.split('.')) { if (v == null) return undefined; v = v[k]; } return v; };
const __hole = s => { const m = /^\s*\{\{\s*([\w.$]+)\s*\}\}\s*$/.exec(s || ''); return m ? m[1] : null; };
